<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:dark}body{margin:0}</style></head><body>
<title>Fabriksgolvet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=VT323&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: pixelfabrik i helskärm. Statusrad + linjeflikar överst, maskinlist nederst, paneler som pixelrutor över golvet */
:root{
  --bg:#141518; --panel:#2a2d34; --hi:#41464f; --lo:#16181b; --edge:#0b0c0e;
  --btn:#454a54; --btnhi:#5c626e; --ink:#f2ecda; --muted:#a8a190; --gold:#ffcc33; --money:#9be36d; --bad:#ff6b57; --blue:#7fd0ff;
  --px:"Pixelify Sans","Courier New",monospace; --head:"Silkscreen","Courier New",monospace; --num:"VT323","Courier New",monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--px);font-size:15px;overflow:hidden;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
.bar{display:flex;align-items:center;gap:14px;padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);flex-shrink:0;overflow-x:auto;scrollbar-width:thin;box-shadow:inset 0 2px 0 var(--hi),inset 0 -2px 0 var(--lo)}
.top{border-bottom:3px solid var(--edge)}
.lines{border-bottom:3px solid var(--edge);background:#202328;padding-block:5px;gap:6px}
.tools{border-top:3px solid var(--edge);gap:6px;padding-block:6px;align-items:stretch}
.brand{font-family:var(--head);font-weight:700;font-size:20px;letter-spacing:.02em;color:var(--gold);text-shadow:2px 2px 0 #000;flex-shrink:0;line-height:1}
.stat{display:flex;flex-direction:column;line-height:1.05;flex-shrink:0;background:var(--lo);padding:4px 10px;box-shadow:inset 2px 2px 0 #000,inset -2px -2px 0 var(--hi)}
.lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.num{font-family:var(--num);font-weight:400;font-size:26px;line-height:.95;letter-spacing:.03em;font-variant-numeric:tabular-nums;text-shadow:2px 2px 0 #000}
.money .num{color:var(--money);font-size:30px}
.spacer{flex:1}
.navbtns{display:flex;gap:6px;flex-shrink:0}
button{font:inherit;font-family:var(--px);font-weight:500;color:var(--ink);background:var(--btn);border:0;border-radius:0;padding:6px 10px;cursor:pointer;white-space:nowrap;box-shadow:inset 2px 2px 0 var(--btnhi),inset -2px -3px 0 rgba(0,0,0,.45),0 0 0 2px var(--edge)}
button:hover:not(:disabled){background:#525865}
button:active:not(:disabled){box-shadow:inset 2px 3px 0 rgba(0,0,0,.45),0 0 0 2px var(--edge);transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
button:disabled{opacity:.45;cursor:not-allowed}
button.gold{background:#a7801a;box-shadow:inset 2px 2px 0 #e0b23a,inset -2px -3px 0 rgba(0,0,0,.45),0 0 0 2px var(--edge);color:#fff6d8}
button.red{background:#8a3a30;box-shadow:inset 2px 2px 0 #b8564a,inset -2px -3px 0 rgba(0,0,0,.45),0 0 0 2px var(--edge)}
kbd{font-family:var(--px);font-weight:700;font-size:11px;background:#111;color:var(--gold);padding:0 4px;margin-right:6px;box-shadow:inset -1px -2px 0 #333}
.linetab{padding:4px 12px;font-size:14px}
.linetab.on{background:#a7801a;box-shadow:inset 2px 2px 0 #e0b23a,inset -2px -3px 0 rgba(0,0,0,.45),0 0 0 2px var(--edge)}
.grp{display:flex;flex-direction:column;gap:3px;flex-shrink:0}
.grp .gl{font-family:var(--head);font-size:10px;color:var(--muted);padding-left:2px}
.grp .gb{display:flex;gap:6px}
.tool{display:flex;flex-direction:column;align-items:center;gap:1px;width:78px;padding:4px 3px 3px;position:relative;flex-shrink:0}
.tool img{width:32px;height:32px;image-rendering:pixelated}
.tool .tn{font-size:11.5px;line-height:1.05;white-space:normal;text-align:center;min-height:2.1em;display:flex;align-items:center}
.tool .tc{font-family:var(--num);font-size:17px;line-height:1;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:clip;max-width:100%;color:var(--money);font-variant-numeric:tabular-nums}
.tool kbd{position:absolute;top:2px;left:2px;margin:0}
.tool .var{position:absolute;top:2px;right:3px;font-family:var(--num);font-size:15px;line-height:1;color:var(--blue)}
.tool.on{background:#6e5a1a;box-shadow:inset 2px 2px 0 var(--gold),inset -2px -3px 0 rgba(0,0,0,.5),0 0 0 2px var(--edge)}
.tool.poor .tc{color:var(--bad)}
.tool.lock{opacity:.6}
.tool.lock img{filter:grayscale(1) brightness(.6)}
.tool.lock .tc{color:var(--gold)}
@media (max-width:1320px){.tool{width:72px}.tools{gap:5px}.grp .gb{gap:5px}}
@media (max-width:1400px){.navbtns button{padding:6px 7px}.navbtns kbd{margin-right:4px}.bar{gap:10px}.stat{padding:3px 8px}.num{font-size:23px}.money .num{font-size:26px}}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#101114}
#floor{display:block;position:absolute;inset:0;cursor:crosshair;touch-action:none;image-rendering:pixelated}
.pxbox{background:var(--panel);box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--lo),0 0 0 3px var(--edge),6px 6px 0 rgba(0,0,0,.45)}
#insp{position:absolute;top:14px;right:14px;width:320px;max-width:calc(100% - 28px);max-height:calc(100% - 28px);overflow:auto;padding:12px}
.ih{display:flex;gap:10px;align-items:flex-start}
.ih img{width:48px;height:48px;image-rendering:pixelated;flex-shrink:0}
.ih h3{font-family:var(--head);font-size:17px;margin:0;line-height:1.1;color:var(--gold)}
.ih p{margin:4px 0 0;color:var(--muted);font-size:13.5px;line-height:1.3}
.ih .x{margin-left:auto;padding:2px 8px}
.isec{margin-top:12px;display:flex;flex-direction:column;gap:7px}
.isec h4{margin:0;font-family:var(--head);font-size:11px;color:var(--muted);font-weight:400}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px 3px 4px;font-size:13px}
.chip img{width:24px;height:24px;image-rendering:pixelated}
.chip.on{background:#6e5a1a;box-shadow:inset 2px 2px 0 var(--gold),inset -2px -3px 0 rgba(0,0,0,.5),0 0 0 2px var(--edge)}
.live{font-size:14px;background:var(--lo);padding:8px 10px;line-height:1.45;box-shadow:inset 2px 2px 0 #000;font-variant-numeric:tabular-nums}
.live .ing{display:flex;align-items:center;gap:6px}
.live img{width:20px;height:20px;image-rendering:pixelated}
.ok{color:var(--money)} .warn{color:var(--bad)}
.ratio{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:6px 8px;align-items:center}
.ratio b{font-family:var(--num);font-size:20px;font-variant-numeric:tabular-nums;min-width:1.2em;text-align:center}
#modal{position:absolute;inset:0;background:rgba(5,6,8,.72);display:flex;align-items:flex-start;justify-content:center;padding:20px 16px;overflow:auto}
.sheet{width:100%;max-width:900px;padding:16px 20px 20px}
.shh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.shh h2{font-family:var(--head);font-size:26px;margin:0;line-height:1;color:var(--gold);text-shadow:3px 3px 0 #000;text-wrap:balance}
.sheet h3{font-family:var(--head);font-size:12px;color:var(--muted);margin:18px 0 8px;font-weight:400}
.sheet>p{color:var(--muted);margin:0 0 6px;max-width:65ch;line-height:1.4}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:#33373f;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:inset 2px 2px 0 #484d57,inset -2px -2px 0 #1e2125,0 0 0 2px var(--edge)}
.card .ch{display:flex;align-items:center;gap:4px 8px;flex-wrap:wrap}
.card .ch img{width:32px;height:32px;image-rendering:pixelated}
.card .ch b{font-size:16px;font-weight:600}
.card .lvl{margin-left:auto;color:var(--muted);font-family:var(--num);font-size:18px;white-space:nowrap}
.card p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.3}
.card .fx{font-size:14px}
.card button{margin-top:auto}
.card.done{opacity:.72}
.card .meta{font-size:13px;color:var(--muted)}
.recipe{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:13px}
.recipe span{display:inline-flex;align-items:center;gap:3px}
.recipe img{width:22px;height:22px;image-rendering:pixelated}
.tier{font-family:var(--head);font-size:10px;background:#111;color:var(--blue);padding:1px 5px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:5px 8px;border-bottom:2px solid #1e2125;vertical-align:middle}
th{font-family:var(--head);font-size:10px;color:var(--muted);font-weight:400}
td.v{font-family:var(--num);font-size:19px;letter-spacing:.02em;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;color:var(--money)}
td img{width:24px;height:24px;vertical-align:middle;margin-right:6px;image-rendering:pixelated}
.locked{opacity:.4}
.help{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.help dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;align-items:baseline}
.help dt{white-space:nowrap}
.help dd{margin:0;color:var(--muted)}
.help p,.help li{color:var(--muted);line-height:1.4;max-width:65ch}
.help ol{padding-left:20px;margin:0}
textarea{width:100%;min-height:70px;font-family:monospace;font-size:12px;background:var(--lo);color:var(--ink);border:0;padding:8px;box-shadow:inset 2px 2px 0 #000;resize:vertical}
.big{font-family:var(--head);font-size:40px;color:var(--money);text-shadow:3px 3px 0 #000;margin:8px 0 14px}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#5a221c;color:#ffe0da;padding:7px 14px;font-weight:600;pointer-events:none;opacity:0;white-space:nowrap;box-shadow:inset 2px 2px 0 #8a3a30,0 0 0 3px var(--edge),4px 4px 0 rgba(0,0,0,.5)}
#toast.good{background:#24451c;color:#ddffd0;box-shadow:inset 2px 2px 0 #3f7a32,0 0 0 3px var(--edge),4px 4px 0 rgba(0,0,0,.5)}
#toast.show{opacity:1}
#hint{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:12px;padding:5px 10px;font-size:13px;color:var(--muted);pointer-events:none;max-width:calc(100% - 28px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hint b{color:var(--ink)}
#areabar{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);padding:8px 10px;display:flex;gap:8px;align-items:center;white-space:nowrap}
#paused{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-family:var(--head);font-size:56px;color:var(--gold);text-shadow:4px 4px 0 #000}
</style>

<header class="bar top">
  <div class="brand">FABRIKS<br>GOLVET</div>
  <div class="stat money"><span class="lbl">Kassa</span><span id="money" class="num">0 kr</span></div>
  <div class="stat"><span class="lbl">Inkomst</span><span id="rate" class="num">0 kr/s</span></div>
  <div class="stat"><span class="lbl">Startare</span><span id="startc" class="num">0/4</span></div>
  <div class="spacer"></div>
  <div class="navbtns">
    <button data-panel="mach"><kbd>M</kbd>Maskiner</button>
    <button data-panel="upg"><kbd>U</kbd>Uppgraderingar</button>
    <button data-panel="bp"><kbd>B</kbd>Ritningar</button>
    <button data-panel="info"><kbd>I</kbd>Priser</button>
    <button data-panel="stats"><kbd>T</kbd>Statistik</button>
    <button data-panel="help"><kbd>H</kbd>Hjälp</button>
  </div>
</header>
<nav class="bar lines" id="lines"></nav>
<main id="stage">
  <canvas id="floor"></canvas>
  <div id="hint" class="pxbox"></div>
  <div id="areabar" class="pxbox" hidden></div>
  <div id="paused" hidden>PAUS</div>
  <aside id="insp" class="pxbox" hidden></aside>
  <div id="modal" hidden><div class="sheet pxbox" id="sheet"></div></div>
  <div id="toast"></div>
</main>
<footer class="bar tools" id="tools"></footer>

<script>
(()=>{
"use strict";
/* ============ PIXEL PALETTE ============ */
const K='#121317',DK='#23262b',Y='#ffcc33';
const PAL={k:K,D:DK,y:Y,o:'#e8892b',r:'#e0453a',g:'#3fae4f',G:'#1f6b2c',u:'#3d7be0',U:'#1d3f80',w:'#f4f1e8',s:'#b8c0cc',S:'#7d8794',d:'#3a3f48',c:'#d07a3e',p:'#8b5cd6',P:'#5a3a96',e:'#59d6e8'};
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const m=f>0?255:0,a=Math.abs(f);r=Math.round(r+(m-r)*a);g=Math.round(g+(m-g)*a);b=Math.round(b+(m-b)*a);return'#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);}
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function P(g,x,y,col,w,h){g.fillStyle=col;g.fillRect(x,y,w||1,h||1);}
function drawMap(g,map,ox,oy,pal){for(let y=0;y<map.length;y++){const row=map[y];for(let x=0;x<8&&x<row.length;x++){const ch=row[x];if(ch==='.')continue;const col=(pal&&pal[ch])||PAL[ch];if(col)P(g,ox+x,oy+y,col);}}}

/* ============ ITEM ART (8x8) ============ */
const FORM_MAP={
 raw:["..kkkk..",".kbbaak.","kbaaacck","kaaacack","kacaaack","kaaaccck",".kcccck.","..kkkk.."],
 liquid:["...kk...","..kbak..",".kbaaak.",".kbaaak.","kbaaaaak","kaaaaack",".kaacck.","..kkkk.."],
 gear:[".k.kk.k.","kakaakak",".kabaak.","kaakkaak","kaakkack",".kaacak.","kakcckak",".k.kk.k."],
 wire:["..kkkk..",".kabbak.","kakkkkak","kakDDkak","kakDDkck","kakkkkck",".kaccck.","..kkkk.."],
 plate:["........","kkkkkkkk","kbbbbbak","kbaaaaak","kbaaaaak","kaaaaack","kkkkkkkk","........"],
 rad:["..kkkk..",".kbbbak.","kbbaaaak","kbaakaak","kaakkkak","kaaaaack",".kaccck.","..kkkk.."],
 energy:["..kkkk..",".kyyyyk.",".kykkyk.",".kyyyyk.",".kgyygk.",".kggggk.",".kggggk.",".kkkkkk."],
 cable:["kkkkkkkk","kabkabkk","kbakbakk","kkkkkkkk","kDDDDDDk","kabkabkk","kbakbakk","kkkkkkkk"]
};
const PROD_MAP={
 motor:["........","kkkkkk..","kSsssk..","kcccckkk","kcccckSk","kSsssk..","kkkkkk..","........"],
 circuit:["kkkkkkkk","kggyyggk","kgkkkkgk","kykDDkyk","kykDDkyk","kgkkkkgk","kGGyyGGk","kkkkkkkk"],
 bulb:["..kkkk..",".kwyywk.","kwyyyywk","kyyyyyyk",".kyyyyk.","..kssk..","..kSSk..","...kk..."],
 battery:["...kk...","..kssk..",".kuuuuk.",".kuwwuk.",".kuuuuk.",".kUUUUk.",".kUUUUk.",".kkkkkk."],
 generator:["kkkkkkkk","kSsssSSk","ksyyyysk","ksyrrysk","ksyyyysk","kSsssSSk","kkkkkkkk","k......k"],
 processor:[".s.ss.s.","skkkkkks",".kddddk.",".kdppdk.",".kdppdk.",".kddddk.","skkkkkks",".s.ss.s."],
 solar:["kkkkkkkk","kuUuUuUk","kUuUuUuk","kuUuUuUk","kUuUuUuk","kkkkkkkk","...SS...","..kkkk.."],
 laser:["........","kkkkkk..","kssssk..","ksddsrrr","ksddsrrr","kssssk..","kkkkkk..","........"],
 phone:[".kkkkkk.",".kddddk.",".kuuuuk.",".kuwuuk.",".kuuuuk.",".kuuuuk.",".kddsdk.",".kkkkkk."],
 computer:["kkkkkkkk","kuuuuuuk","kuwuuuuk","kuuuuuuk","kkkkkkkk","...kk...","..kSSk..",".kkkkkk."],
 tablet:["kkkkkkkk","kduuuudk","kduwuudk","kduuuudk","kduuuudk","kduuuusk","kkkkkkkk","........"],
 robot:["...kr...",".kkkkkk.","kssssssk","ksesseSk","kssssssk","ksddddsk","kssssssk",".kkkkkk."],
 core:[".kkkkkk.","kSssssSk","ksgggg sk".replace(' ',''),"ksgyygsk","ksgyygsk","ksggggsk","kSssssSk",".kkkkkk."],
 fusionbat:["...kk...","..kssk..",".kppppk.",".kpyypk.",".kpyypk.",".kPPPPk.",".kPPPPk.",".kkkkkk."],
 qcomp:["kkkkkkkk","kpppPppk","kpekkepk","kpkeekpk","kpekkepk","kkkkkkkk","..kSSk..",".kkkkkk."],
 station:["...kk...","..kssk..","kkkSSkkk","uukggkuu","uukggkuu","kkkSSkkk","..kssk..","...kk..."],
 android:["..kkkk..",".kwwwwk.",".kegewk.",".kwwwwk.","kkkppkkk","kwkppkwk","..kwwk..","..k..k.."],
 timemachine:[".kkkkkk.","kyyyyyyk",".kpyypk.","..kppk..","..kyyk..",".kyppyk.","kyyyyyyk",".kkkkkk."],
 satellite:["...y....","...k....","kk.kk.kk","uukSSkuu","uukSskuu","kk.kk.kk","...k....","........"]
};

/* ============ DATA ============ */
const TS=48,DIRS=[[1,0],[0,1],[-1,0],[0,-1]];
const RAW={copper:{n:'Koppar',v:10,c:'#d07a3e'},iron:{n:'Järn',v:12,c:'#a3abb5'},gold:{n:'Guld',v:30,c:'#ecc13e'},alu:{n:'Aluminium',v:25,c:'#dde6ee'},silicon:{n:'Kisel',v:40,c:'#7c8cc0'},diamond:{n:'Diamant',v:120,c:'#7fe8f0'}};
const RAW_UNLOCK={copper:0,iron:500,gold:5000,alu:15000,silicon:40000,diamond:200000};
const FORMS={liquid:{m:1.5,mach:'furnace',nm:n=>'Flytande '+n.toLowerCase()},gear:{m:1.8,mach:'cutter',nm:n=>n+'kugghjul'},wire:{m:1.7,mach:'wire',nm:n=>n+'tråd'},plate:{m:1.7,mach:'press',nm:n=>n+'plåt'}};
const RES={};
for(const k in RAW){
  RES[k]={n:RAW[k].n,v:RAW[k].v,c:RAW[k].c,kind:'raw',base:k};
  for(const f in FORMS)RES[k+'_'+f]={n:FORMS[f].nm(RAW[k].n),v:Math.round(RAW[k].v*FORMS[f].m),c:RAW[k].c,kind:f,base:k,mach:FORMS[f].mach};
  RES[k+'_cable']={n:RAW[k].n+'kabel',v:Math.round(RES[k+'_wire'].v*3*1.4),c:RAW[k].c,kind:'cable',base:k,mach:'cable'};
}
const RAD={uranium:{n:'Uran',v:400,c:'#7be35a'},plutonium:{n:'Plutonium',v:700,c:'#c46bff'}};
const RAD_UNLOCK={uranium:0,plutonium:75e6};
for(const k in RAD)RES[k]={n:RAD[k].n,v:RAD[k].v,c:RAD[k].c,kind:'rad',base:k};
RES.energy={n:'Energicell',v:60,kind:'energy'};
const REFINE={uranium:2,plutonium:3};
const RECIPES=[
 {id:'motor',n:'Motor',tier:1,in:{iron_gear:2,copper_wire:1},cost:3000},
 {id:'circuit',n:'Kretskort',tier:1,in:{copper_wire:2,gold_plate:1},cost:8000},
 {id:'bulb',n:'Glödlampa',tier:1,in:{silicon_liquid:1,copper_wire:1},cost:12000},
 {id:'battery',n:'Batteri',tier:1,in:{alu_liquid:1,copper_plate:1,iron_plate:1},cost:20000},
 {id:'generator',n:'Generator',tier:2,in:{copper_cable:1,iron_plate:2,motor:1},cost:60000},
 {id:'processor',n:'Processor',tier:2,in:{circuit:1,silicon:2,gold_wire:1},cost:90000},
 {id:'solar',n:'Solpanel',tier:2,in:{silicon_plate:2,circuit:1,alu_plate:1},cost:150000},
 {id:'laser',n:'Laser',tier:2,in:{battery:1,diamond_plate:1,bulb:1},cost:300000},
 {id:'phone',n:'Telefon',tier:3,in:{processor:1,battery:1,alu_plate:2},cost:600000},
 {id:'computer',n:'Dator',tier:3,in:{processor:1,generator:1,circuit:2,alu_plate:2},cost:1200000},
 {id:'tablet',n:'Surfplatta',tier:3,in:{phone:1,solar:1,alu_plate:2},cost:2500000},
 {id:'robot',n:'Robot',tier:3,in:{computer:1,motor:2,diamond_gear:1},cost:6000000},
 {id:'satellite',n:'Satellit',tier:3,in:{robot:1,solar:2,laser:1,gold_cable:1},cost:20000000},
 {id:'core',n:'Reaktorkärna',tier:4,in:{uranium:2,iron_plate:2,copper_cable:1},en:2,cost:30e6},

function mk(t,x,y,d,cfg,paid,line){
  const o={t,x,y,d,cfg:cfg?JSON.parse(JSON.stringify(cfg)):{},paid:paid||0,line,its:[],qw:0,qn:0,energy:0,inp:null,q:null,timer:0,buf:{},cb:[],busy:false,hold:null,idx:0,tq:[],oq:[]};
  if(t==='starter'&&!o.cfg.res)o.cfg.res=lastStarterRes;
  if(t==='radstarter'&&!o.cfg.res)o.cfg.res='uranium';
  if((t==='lsel'||t==='rsel')&&!o.cfg.res)o.cfg.res='copper';
  if(t==='msel'){if(!o.cfg.l)o.cfg.l='copper';if(!o.cfg.r)o.cfg.r='iron';}
  if(t==='asplit'&&!o.cfg.ratio)o.cfg.ratio=[1,1,1];
  if((t==='tin'||t==='tout')&&!o.cfg.ch)o.cfg.ch=1;
  if(t.startsWith('crafter')&&o.cfg.rec===undefined){const mkv=M[t].mk;o.cfg.rec=(lastRec&&S.rec[lastRec]&&RECMAP[lastRec].tier<=mkv)?lastRec:(RECIPES.find(r=>S.rec[r.id]&&r.tier<=mkv)||{}).id||null;}
  return o;
}
let warned=false;
function canPlace(x,y,t,silent){
  const say=m=>{if(!silent||!warned){toast(m);warned=true;}return false;};
  if(!S.unl[t])return say(M[t].n+' är låst. Lås upp den under Maskiner (M).');
  if(!inBounds(x,y))return silent?false:say('Utanför linjen. Köp Större yta i raden med linjer.');
  if(tileAt(x,y))return false;
  if(isStarter(t)&&starterCount()>=maxStarters())return say('Max antal startare på linjen. Uppgradera Fler startare.');
  const c=machineCost(t);if(S.money<c)return say('Inte råd: '+M[t].n+' kostar '+fmt(c)+' kr');
  return true;
}
function place(x,y,t,d,silent,cfg){
  if(!canPlace(x,y,t,silent))return false;
  const c=machineCost(t);S.money-=c;
  const use=cfg||((copyCfg&&copyCfg.t===t)?copyCfg.cfg:null);
  const o=mk(t,x,y,d,use,c,L());L().grid.set(key(x,y),o);
  if(t.startsWith('crafter')&&!silent&&!cfg)openInspector(o);
  return true;
}
function clearTile(t){let n=t.its.length+(t.q?(t.qn||1):0)+(t.inp?1:0)+(t.hold?1:0)+t.cb.length+t.tq.length+t.oq.length;for(const k in t.buf)n+=t.buf[k];
  t.its=[];t.q=null;t.qn=0;t.qw=0;t.inp=null;t.hold=null;t.buf={};t.cb=[];t.busy=false;t.timer=0;t.tq=[];t.oq=[];t.wrong=null;return n;}
function clearTiles(ts,label){let n=0;for(const t of ts)n+=clearTile(t);toast(n?label+': tog bort '+n+' saker':'Inget att tömma',!!n);}
function removeAt(x,y){const t=tileAt(x,y);if(!t)return;S.money+=t.paid;L().grid.delete(key(x,y));if(sel===t)closeInspector();}

const isProc=t=>PROC.includes(t);
function accept(t,item,travel){
  const from=(travel+2)%4,back=(t.d+2)%4;
  switch(t.t){
    case 'roller':if(t.d===from||t.its.length>=24)return false;t.its.push({item,prog:0,from});return true;
    case 'seller':sell(item,t);return true;
    case 'wire':case 'furnace':case 'cutter':case 'press':
      if(t.d===from||t.inp||RES[item].kind!=='raw')return false;t.inp=item;t.timer=0;return true;
    case 'cable':
      if(t.d===from||t.busy||RES[item].kind!=='wire'||t.cb.length>=3||(t.cb.length&&t.cb[0]!==item))return false;t.cb.push(item);return true;
    case 'crafter1':case 'crafter2':case 'crafter3':case 'crafter4':case 'crafter5':{
      if(t.d===from)return false;
      if(item==='energy'&&M[t.t].rad){if(t.energy>=20)return false;t.energy++;return true;}
      if(!t.cfg.rec||RECMAP[t.cfg.rec].tier>M[t.t].mk)return false;const need=RECMAP[t.cfg.rec].in[item];
      if(!need){t.wrong=item;t.wrongAt=time;return false;}if((t.buf[item]||0)>=need*2)return false;t.buf[item]=(t.buf[item]||0)+1;return true;}
    case 'splitter':case 'lsplit':case 'rsplit':case 'asplit':case 'lsel':case 'rsel':case 'msel':
      if(from!==back||t.hold)return false;t.hold=item;t.timer=0;return true;
    case 'refinery':if(t.d===from||t.inp||RES[item].kind!=='rad')return false;t.inp=item;t.timer=0;return true;
    case 'tin':if(t.tq.length>=3)return false;t.tq.push({item,age:0});return true;
  }
  return false;
}
const nbr=(t,dir)=>t.line.grid.get(key(t.x+DIRS[dir][0],t.y+DIRS[dir][1]));
function push(t,item,dir){const n=nbr(t,dir);return n?accept(n,item,dir):false;}
function routeCycle(t,outs){const n=outs.length;for(let k=0;k<n;k++){const o=outs[(t.idx+k)%n];if(!nbr(t,o))continue;if(push(t,t.hold,o)){t.hold=null;t.idx=(t.idx+k+1)%n;return;}}}
function earn(v){earnBucket+=v;if(v>0)S.total+=v;}
function sell(item,t){
  const v=RES[item].v*priceMult();S.money+=v;earn(v);S.sold[item]=(S.sold[item]||0)+1;salesAcc[item]=(salesAcc[item]||0)+1;valAcc[item]=(valAcc[item]||0)+v;
  if(t.line===L()&&floats.length<60)floats.push({x:t.x*TS+TS/2+(Math.random()*20-10),y:t.y*TS+6-Math.random()*8,txt:'+'+fmt(v),life:1});
}
function stepLine(line,dt){
  const bs=beltSpeed(),si=spawnInt(),ct=craftTime(),outs=new Map();
  for(const t of line.grid.values())if(t.t==='tout'){if(!outs.has(t.cfg.ch))outs.set(t.cfg.ch,[]);outs.get(t.cfg.ch).push(t);}
  for(const t of line.grid.values()){
    switch(t.t){
      case 'roller':if(t.its.length){const its=t.its;let w=0;for(let i=0;i<its.length;i++){const a=its[i];a.prog=Math.min(1,a.prog+bs*dt);if(a.prog>=1&&push(t,a.item,t.d))continue;its[w++]=a;}its.length=w;}break;
      case 'starter':if(!t.q){t.timer+=dt;if(t.timer>=si){t.q=t.cfg.res;t.timer=0;}}if(t.q&&push(t,t.q,t.d))t.q=null;break;
      case 'radstarter':if(!t.q){t.timer+=dt;if(t.timer>=radInt()){t.q=t.cfg.res;t.timer=0;}}if(t.q&&push(t,t.q,t.d))t.q=null;break;
      case 'refinery':
        if(t.inp&&!t.q){t.timer+=dt;if(t.timer>=refTime()){t.q='energy';t.qn=REFINE[t.inp]||1;t.inp=null;t.timer=0;}}
        while(t.q&&push(t,t.q,t.d)){t.qn--;if(t.qn<=0){t.q=null;t.qn=0;}}break;
      case 'wire':case 'furnace':case 'cutter':case 'press':
        if(t.inp&&!t.q){t.timer+=dt;if(t.timer>=mTime(t.t)){t.q=t.inp+'_'+M[t.t].form;t.inp=null;t.timer=0;}}
        if(t.q&&push(t,t.q,t.d))t.q=null;break;
      case 'cable':
        if(!t.busy&&!t.q&&t.cb.length===3){t.busy=true;t.timer=0;}
        if(t.busy){t.timer+=dt;if(t.timer>=mTime('cable')){t.q=RES[t.cb[0]].base+'_cable';t.cb=[];t.busy=false;}}
        if(t.q&&push(t,t.q,t.d))t.q=null;break;
      case 'crafter1':case 'crafter2':case 'crafter3':case 'crafter4':case 'crafter5':{
        const r=t.cfg.rec&&RECMAP[t.cfg.rec]&&RECMAP[t.cfg.rec].tier<=M[t.t].mk?RECMAP[t.cfg.rec]:null;
        if(r&&!t.q&&!t.busy){let ok=t.energy>=r.en||!M[t.t].rad&&!r.en;for(const k in r.in)if((t.buf[k]||0)<r.in[k]){ok=false;break;}if(ok){for(const k in r.in)t.buf[k]-=r.in[k];if(M[t.t].rad)t.energy-=r.en;t.busy=true;t.timer=0;t.making=r.id;}}
        if(t.busy){t.timer+=dt;if(t.timer>=ct){t.busy=false;t.q=t.making;}}
        if(t.q&&push(t,t.q,t.d))t.q=null;break;}
      case 'splitter':case 'lsplit':case 'rsplit':case 'asplit':
        if(t.hold){t.timer+=dt;if(t.timer>=.1){const l=(t.d+3)%4,r=(t.d+1)%4,f=t.d;let o;
          if(t.t==='splitter')o=[l,r];else if(t.t==='lsplit')o=[f,l];else if(t.t==='rsplit')o=[f,r];
          else{o=[];const[a,b,c]=t.cfg.ratio;for(let i=0;i<a;i++)o.push(l);for(let i=0;i<b;i++)o.push(f);for(let i=0;i<c;i++)o.push(r);if(!o.length)o=[f];}
          routeCycle(t,o);}}break;
      case 'lsel':case 'rsel':case 'msel':
        if(t.hold){t.timer+=dt;if(t.timer>=.1){let o=t.d;
          if(t.t==='lsel'&&t.hold===t.cfg.res)o=(t.d+3)%4;else if(t.t==='rsel'&&t.hold===t.cfg.res)o=(t.d+1)%4;
          else if(t.t==='msel'){if(t.hold===t.cfg.l)o=(t.d+3)%4;else if(t.hold===t.cfg.r)o=(t.d+1)%4;}
          if(push(t,t.hold,o))t.hold=null;}}break;
      case 'tin':{
        for(const e of t.tq)e.age+=dt;
        if(t.tq.length&&t.tq[0].age>=1){const list=outs.get(t.cfg.ch)||[];
          for(let k=0;k<list.length;k++){const o=list[(t.idx+k)%list.length];if(o.oq.length<3){o.oq.push(t.tq.shift().item);t.idx=(t.idx+k+1)%list.length;break;}}}
        break;}
      case 'tout':if(t.oq.length&&push(t,t.oq[0],t.d))t.oq.shift();break;
    }
    if(t.q)t.qw+=dt;else t.qw=0;
  }
}
function update(dt){
  for(const line of S.lines)stepLine(line,dt);
  secAcc+=dt;
  if(secAcc>=1){secAcc-=1;earnWin.push(earnBucket);earnBucket=0;if(earnWin.length>60)earnWin.shift();
    const ids=new Set([...Object.keys(ema),...Object.keys(salesAcc)]);
    for(const id of ids){ema[id]=(ema[id]||0)*.92+(salesAcc[id]||0)*.08;emaV[id]=(emaV[id]||0)*.92+(valAcc[id]||0)*.08;salesAcc[id]=0;valAcc[id]=0;}}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.life-=dt*.9;f.y-=dt*26;if(f.life<=0)floats.splice(i,1);}
}
const currentRate=()=>earnWin.length?earnWin.reduce((a,b)=>a+b,0)/earnWin.length:0;

const canvas=document.getElementById('floor'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage');
let W=0,H=0,DPR=1,floorCv=null,floorLand=-1;
function resize(){const r=stage.getBoundingClientRect();DPR=window.devicePixelRatio||1;W=r.width;H=r.height;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);}
function buildFloor(){
  floorLand=S.cur+':'+landLv();floorCv=cv(GWMAX*16,GHMAX*16);const g=floorCv.getContext('2d');
  P(g,0,0,'#1a1c20',GWMAX*16,GHMAX*16);
  for(let y=0;y<GHMAX*16;y++)for(let x=(y%8);x<GWMAX*16;x+=8)P(g,x,y,'#1f2126',2,1);
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let ty=0;ty<gh();ty++)for(let tx=0;tx<gw();tx++){const ox=tx*16,oy=ty*16;
    P(g,ox,oy,'#3b4048',16,16);P(g,ox,oy,'#464c55',16,1);P(g,ox,oy,'#464c55',1,16);P(g,ox,oy+15,'#2f3339',16,1);P(g,ox+15,oy,'#2f3339',1,16);
    for(const[a,b]of[[2,2],[13,2],[2,13],[13,13]])P(g,ox+a,oy+b,'#525862');
    for(let i=0;i<3;i++)P(g,ox+2+Math.floor(rnd()*12),oy+2+Math.floor(rnd()*12),'#373b42');}
}
function drawSpr(g,spr,x,y,d){if(!d){g.drawImage(spr,x,y,TS,TS);return;}g.save();g.translate(x+TS/2,y+TS/2);g.rotate(d*Math.PI/2);g.drawImage(spr,-TS/2,-TS/2,TS,TS);g.restore();}
function drawIt(g,id,cx,cy,sz){g.drawImage(itemSpr(id),Math.round(cx-sz/2),Math.round(cy-sz/2),sz,sz);}
function pbar(g,x,y,f,col){P(g,x+9,y+TS-10,K,TS-18,5);P(g,x+10,y+TS-9,col,(TS-20)*Math.min(1,f),3);}
const NODIR=t=>t==='seller'||t==='tin';
function drawTile(g,t,live){
  const x=t.x*TS,y=t.y*TS,cx=x+TS/2,cy=y+TS/2;
  if(t.t==='roller'){const f=live?Math.floor(time*16*beltSpeed())&7:0;drawSpr(g,ROLL[f],x,y,t.d);return;}
  drawSpr(g,SPR[t.t],x,y,NODIR(t.t)?0:t.d);
  const c=t.cfg||{};
  switch(t.t){
    case 'starter':drawIt(g,c.res,cx,cy,16);if(live)pbar(g,x,y,t.timer/spawnInt(),'#7fd0ff');break;
    case 'radstarter':drawIt(g,c.res,cx,cy,16);if(live)pbar(g,x,y,t.timer/radInt(),'#7be35a');break;
    case 'refinery':if(live&&t.inp){drawIt(g,t.inp,cx,cy,14);pbar(g,x,y,t.timer/refTime(),'#7be35a');}break;
    case 'wire':case 'furnace':case 'cutter':case 'press':if(live&&t.inp){drawIt(g,t.inp,cx,cy,16);pbar(g,x,y,t.timer/mTime(t.t),Y);}break;
    case 'cable':if(live){if(t.cb.length)drawIt(g,t.cb[0],cx,cy-2,16);for(let i=0;i<3;i++)P(g,x+16+i*6,y+TS-12,i<t.cb.length?Y:K,4,4);if(t.busy)pbar(g,x,y,t.timer/mTime('cable'),Y);}break;
    case 'crafter1':case 'crafter2':case 'crafter3':case 'crafter4':case 'crafter5':
      if(c.rec)drawIt(g,c.rec,cx,cy-2,24);else{g.fillStyle=Y;g.font='700 22px "Pixelify Sans",monospace';g.textAlign='center';g.textBaseline='middle';g.fillText('?',cx,cy-2);}
      if(live&&t.busy)pbar(g,x,y,t.timer/craftTime(),'#c7a6ff');
      if(M[t.t].rad){P(g,x+TS-9,y+8,K,5,TS-16);const eh=Math.round((TS-18)*Math.min(1,(t.energy||0)/20));if(eh>0)P(g,x+TS-8,y+TS-9-eh,'#7be35a',3,eh);}break;
    case 'lsel':case 'rsel':{const o=t.t==='lsel'?(t.d+3)%4:(t.d+1)%4;drawIt(g,c.res,cx+DIRS[o][0]*13,cy+DIRS[o][1]*13,16);break;}
    case 'msel':drawIt(g,c.l,cx+DIRS[(t.d+3)%4][0]*13,cy+DIRS[(t.d+3)%4][1]*13,16);drawIt(g,c.r,cx+DIRS[(t.d+1)%4][0]*13,cy+DIRS[(t.d+1)%4][1]*13,16);break;
    case 'tin':case 'tout':g.font='26px VT323,monospace';g.textAlign='center';g.textBaseline='middle';g.fillStyle='#000';g.fillText(c.ch,cx+2,cy+2);g.fillStyle=t.t==='tin'?'#d9c2ff':'#ffd6ad';g.fillText(c.ch,cx,cy);break;
  }
  if(live&&t.hold)drawIt(g,t.hold,cx,cy,14);
  if(live&&t.q){drawIt(g,t.q,cx+DIRS[t.d][0]*15,cy+DIRS[t.d][1]*15,14);}
  if(live&&t.t==='tout'&&t.oq.length)drawIt(g,t.oq[0],cx+DIRS[t.d][0]*15,cy+DIRS[t.d][1]*15,14);
}
function render(){
  const g=ctx;g.setTransform(1,0,0,1,0,0);g.fillStyle='#101114';g.fillRect(0,0,canvas.width,canvas.height);
  g.imageSmoothingEnabled=false;
  const z=cam.z*DPR;g.setTransform(z,0,0,z,Math.round(DPR*(W/2-cam.x*cam.z)),Math.round(DPR*(H/2-cam.y*cam.z)));
  if(floorLand!==S.cur+':'+landLv())buildFloor();
  g.drawImage(floorCv,0,0,GWMAX*TS,GHMAX*TS);
  // hazard border
  const bw=gw()*TS,bh=gh()*TS;
  for(let i=0;i<bw;i+=12){P(g,i,-6,(i/12)%2?K:Y,12,6);P(g,i,bh,(i/12)%2?K:Y,12,6);}
  for(let i=0;i<bh;i+=12){P(g,-6,i,(i/12)%2?K:Y,6,12);P(g,bw,i,(i/12)%2?K:Y,6,12);}
  const grid=L().grid;
  const vx0=Math.floor((cam.x-W/2/cam.z)/TS)-1,vy0=Math.floor((cam.y-H/2/cam.z)/TS)-1,vx1=Math.ceil((cam.x+W/2/cam.z)/TS)+1,vy1=Math.ceil((cam.y+H/2/cam.z)/TS)+1;
  const vis=[];for(const t of grid.values())if(t.x>=vx0&&t.x<=vx1&&t.y>=vy0&&t.y<=vy1)vis.push(t);
  for(const t of vis)if(t.t==='roller')drawTile(g,t,true);
  for(const t of vis)if(t.t!=='roller')drawTile(g,t,true);
  const isz=21;
  for(const t of vis)if(t.t==='roller')for(let ii=0,step=Math.max(1,Math.ceil(t.its.length/8));ii<t.its.length;ii+=step){const it=t.its[ii];
    const p=it.prog,e=DIRS[it.from],o=DIRS[t.d],cx=t.x*TS+TS/2,cy=t.y*TS+TS/2;let px,py;
    if(p<.5){const f=p*2;px=cx+e[0]*TS/2*(1-f);py=cy+e[1]*TS/2*(1-f);}else{const f=(p-.5)*2;px=cx+o[0]*TS/2*f;py=cy+o[1]*TS/2*f;}
    drawIt(g,it.item,px,py,isz);}
  // area selection
  const selList=areaTiles();
  for(const t of selList){g.fillStyle='rgba(127,208,255,.22)';g.fillRect(t.x*TS,t.y*TS,TS,TS);g.strokeStyle='#7fd0ff';g.lineWidth=3;g.strokeRect(t.x*TS+1.5,t.y*TS+1.5,TS-3,TS-3);}
  if(amove&&(amove.dx||amove.dy)){const ok=moveCheck(amove.dx,amove.dy);g.globalAlpha=.6;for(const t of selList)drawTile(g,{t:t.t,x:t.x+amove.dx,y:t.y+amove.dy,d:t.d,cfg:t.cfg},false);g.globalAlpha=1;
    g.strokeStyle=ok?Y:'#ff6b57';g.lineWidth=3;for(const t of selList)g.strokeRect((t.x+amove.dx)*TS+1.5,(t.y+amove.dy)*TS+1.5,TS-3,TS-3);}
  if(moving&&moving.moved&&hover){const[hx,hy]=hover,t=moving.t,ok=inBounds(hx,hy)&&(!tileAt(hx,hy)||tileAt(hx,hy)===t);
    g.fillStyle='rgba(0,0,0,.45)';g.fillRect(t.x*TS,t.y*TS,TS,TS);g.globalAlpha=.75;drawTile(g,{t:t.t,x:hx,y:hy,d:t.d,cfg:t.cfg},false);g.globalAlpha=1;
    g.strokeStyle=ok?Y:'#ff6b57';g.lineWidth=3;g.strokeRect(hx*TS+1.5,hy*TS+1.5,TS-3,TS-3);}
  const ar=areaDrag;
  if(ar){const x0=Math.min(ar.x0,ar.x1),y0=Math.min(ar.y0,ar.y1),x1=Math.max(ar.x0,ar.x1),y1=Math.max(ar.y0,ar.y1);
    g.fillStyle='rgba(127,208,255,.16)';g.fillRect(x0*TS,y0*TS,(x1-x0+1)*TS,(y1-y0+1)*TS);g.strokeStyle='#7fd0ff';g.lineWidth=3;g.setLineDash([8,6]);g.strokeRect(x0*TS,y0*TS,(x1-x0+1)*TS,(y1-y0+1)*TS);g.setLineDash([]);}
  if(sel){g.strokeStyle=Y;g.lineWidth=4;g.strokeRect(sel.x*TS+2,sel.y*TS+2,TS-4,TS-4);}
  // ghost
  if(hover&&!panning&&!moving&&!amove){const[hx,hy]=hover;
    if(tool==='paste'&&clip){const ok=pasteCheck(hx,hy,true);g.globalAlpha=.55;for(const c of clip.cells)drawTile(g,{t:c.t,x:hx+c.dx,y:hy+c.dy,d:c.d,cfg:c.cfg},false);g.globalAlpha=1;
      g.strokeStyle=ok?Y:'#ff6b57';g.lineWidth=3;g.strokeRect(hx*TS,hy*TS,clip.w*TS,clip.h*TS);}
    else if(M[tool]){const occ=tileAt(hx,hy),ok=!occ&&inBounds(hx,hy)&&S.unl[tool]&&S.money>=machineCost(tool)&&!(isStarter(tool)&&starterCount()>=maxStarters());
      if(!occ){g.globalAlpha=.6;const cc=copyCfg&&copyCfg.t===tool?copyCfg.cfg:mk(tool,0,0,0,null,0,null).cfg;drawTile(g,{t:tool,x:hx,y:hy,d:placeDir,cfg:cc},false);g.globalAlpha=1;}
      g.strokeStyle=ok?Y:'#ff6b57';g.lineWidth=3;g.strokeRect(hx*TS+1.5,hy*TS+1.5,TS-3,TS-3);}
    else if(tool==='demolish'){if(tileAt(hx,hy)){g.fillStyle='rgba(255,107,87,.3)';g.fillRect(hx*TS,hy*TS,TS,TS);}g.strokeStyle='#ff6b57';g.lineWidth=3;g.strokeRect(hx*TS+1.5,hy*TS+1.5,TS-3,TS-3);}
    else{g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=2;g.strokeRect(hx*TS+1,hy*TS+1,TS-2,TS-2);}
  }
  g.font='22px VT323,monospace';g.textAlign='center';g.textBaseline='alphabetic';g.lineJoin='round';g.lineWidth=4;g.strokeStyle='#000';
  for(const f of floats){g.globalAlpha=Math.max(0,Math.min(1,f.life*1.5));g.strokeText(f.txt+' kr',f.x,f.y);g.fillStyle='#9be36d';g.fillText(f.txt+' kr',f.x,f.y);}
  g.globalAlpha=1;
}

const SLOTS=[['starter','radstarter'],['seller'],['wire'],['furnace'],['cutter'],['press'],['cable','refinery'],['crafter1','crafter2','crafter3','crafter4','crafter5'],['roller'],['splitter','lsplit','rsplit','asplit'],['lsel','rsel','msel'],['tin','tout']];
const SLOT_GROUPS=[['Produktion',[0,1,2,3,4,5,6,7]],['Transport',[8,9,10,11]]];

function slotPick(i){const v=SLOTS[i],un=v.filter(t=>S.unl[t]);

  for(let i=0;i<SLOTS.length;i++){const el=$('sc-'+i);if(!el)continue;const v=SLOTS[i];

toolsEl.addEventListener('click',e=>{const s=e.target.closest('[data-slot]');if(s){slotPick(+s.dataset.slot);return;}
  const b=e.target.closest('[data-tool]');if(!b)return;setTool(b.dataset.tool);});
for(const bar of document.querySelectorAll('.bar'))bar.addEventListener('wheel',e=>{if(bar.scrollWidth>bar.clientWidth&&Math.abs(e.deltaY)>Math.abs(e.deltaX)){bar.scrollLeft+=e.deltaY;e.preventDefault();}},{passive:false});
function setTool(t){
  if(M[t]&&copyCfg&&copyCfg.t!==t)copyCfg=null;
  if(t!=='area'&&t!=='paste'){selT.clear();}
  if(t!=='roller'&&tool==='roller')placeDir=machDir;else if(t==='roller'&&tool!=='roller')machDir=placeDir;
  tool=t;const si=slotOf(t);if(si>=0)slotCur[si]=t;

/* area edit */
function areaTiles(){const out=[];for(const t of selT){if(L().grid.get(key(t.x,t.y))===t)out.push(t);else selT.delete(t);}return out;}
function areaRect(){const ts=areaTiles();let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const t of ts){x0=Math.min(x0,t.x);y0=Math.min(y0,t.y);x1=Math.max(x1,t.x);y1=Math.max(y1,t.y);}return[x0,y0,x1,y1];}
function rectSelect(r,add){if(!add)selT.clear();const x0=Math.min(r.x0,r.x1),y0=Math.min(r.y0,r.y1),x1=Math.max(r.x0,r.x1),y1=Math.max(r.y0,r.y1);for(const t of L().grid.values())if(t.x>=x0&&t.x<=x1&&t.y>=y0&&t.y<=y1)selT.add(t);}
function copyArea(){const ts=areaTiles();if(!ts.length){toast('Området är tomt');return;}const[x0,y0,x1,y1]=areaRect();
  clip={w:x1-x0+1,h:y1-y0+1,cells:ts.map(t=>({dx:t.x-x0,dy:t.y-y0,t:t.t,d:t.d,cfg:JSON.parse(JSON.stringify(t.cfg))}))};selT.clear();setTool('paste');toast('Kopierade '+ts.length+' maskiner',true);}
function deleteArea(){const ts=areaTiles();let v=0;for(const t of ts){v+=t.paid;removeAt(t.x,t.y);}selT.clear();updateAreabar();if(ts.length)toast('Rev '+ts.length+' maskiner, +'+fmt(v)+' kr',true);}
function inArea(x,y){const t=tileAt(x,y);return !!t&&selT.has(t);}
function moveTile(t,x,y){if(x===t.x&&y===t.y)return;if(!inBounds(x,y)){toast('Utanför fabriken');return;}if(tileAt(x,y)){toast('Rutan är upptagen');return;}
  L().grid.delete(key(t.x,t.y));t.x=x;t.y=y;L().grid.set(key(x,y),t);}
function moveCheck(dx,dy){const ts=areaTiles(),set=new Set(ts);for(const t of ts){const nx=t.x+dx,ny=t.y+dy;if(!inBounds(nx,ny))return false;const o=tileAt(nx,ny);if(o&&!set.has(o))return false;}return true;}
function moveArea(dx,dy){const ts=areaTiles();if(!ts.length)return;if(!moveCheck(dx,dy)){toast('Får inte plats där');return;}
  for(const t of ts)L().grid.delete(key(t.x,t.y));for(const t of ts){t.x+=dx;t.y+=dy;L().grid.set(key(t.x,t.y),t);}
  toast('Flyttade '+ts.length+' maskiner',true);}
function rotateSel(){const ts=areaTiles();if(!ts.length)return;const[x0,y0,x1,y1]=areaRect(),h=y1-y0+1,set=new Set(ts),np=new Map();
  const cx=(x0+x1)/2,cy=(y0+y1)/2;let mx0=1e9,my0=1e9,mx1=-1e9,my1=-1e9;
  for(const t of ts){const nx=Math.round(cx-(t.y-cy)),ny=Math.round(cy+(t.x-cx));np.set(t,[nx,ny]);mx0=Math.min(mx0,nx);my0=Math.min(my0,ny);mx1=Math.max(mx1,nx);my1=Math.max(my1,ny);}
  let sx=0,sy=0;if(mx0<0)sx=-mx0;else if(mx1>=gw())sx=gw()-1-mx1;if(my0<0)sy=-my0;else if(my1>=gh())sy=gh()-1-my1;
  for(const t of ts){const p=np.get(t);p[0]+=sx;p[1]+=sy;if(!inBounds(p[0],p[1])){toast('Får inte plats när det vrids');return;}const o=tileAt(p[0],p[1]);if(o&&!set.has(o)){toast('Något står i vägen när det vrids');return;}}
  for(const t of ts)L().grid.delete(key(t.x,t.y));
  for(const t of ts){const[nx,ny]=np.get(t);t.x=nx;t.y=ny;if(!NODIR(t.t))t.d=(t.d+1)%4;for(const it of t.its)it.from=(it.from+1)%4;L().grid.set(key(nx,ny),t);}}
function rotClip(){if(!clip)return;const h=clip.h;clip.cells=clip.cells.map(c=>({...c,dx:h-1-c.dy,dy:c.dx,d:(c.d+1)%4}));clip={...clip,w:clip.h,h:clip.w};}
function clipCost(){let c=0,st=0;for(const x of clip.cells){if(x.t==='starter'){c+=starterCost(st);st++;}else c+=M[x.t].cost;}return c;}
function pasteCheck(hx,hy,quiet){
  let st=0;for(const c of clip.cells){const x=hx+c.dx,y=hy+c.dy;if(!inBounds(x,y)||tileAt(x,y)||!S.unl[c.t])return false;if(isStarter(c.t))st++;}
  if(starterCount()+st>maxStarters())return false;return S.money>=clipCost();
}
function pasteAt(hx,hy){
  if(!pasteCheck(hx,hy)){
    let why='Får inte plats här';for(const c of clip.cells){if(!S.unl[c.t]){why=M[c.t].n+' är låst';break;}}
    if(S.money<clipCost())why='Inte råd: kopian kostar '+fmt(clipCost())+' kr';toast(why);return;}
  for(const c of clip.cells){const cost=c.t==='starter'?starterCost():M[c.t].cost;S.money-=cost;L().grid.set(key(hx+c.dx,hy+c.dy),mk(c.t,hx+c.dx,hy+c.dy,c.d,c.cfg,cost,L()));}
}

/* undo */
const undoSt=[],redoSt=[];let pendingEdit=null;
function editSig(){let s='';for(const t of L().grid.values())s+=t.t+t.x+','+t.y+','+t.d+JSON.stringify(t.cfg)+'|';return s;}
function snap(){return{line:S.cur,tiles:[...L().grid.values()].map(t=>({o:t,x:t.x,y:t.y,d:t.d,cfg:JSON.stringify(t.cfg)})),sig:editSig()};}
function beginEdit(){if(!pendingEdit)pendingEdit=snap();}
function endEdit(){if(!pendingEdit)return;const p=pendingEdit;pendingEdit=null;if(p.line!==S.cur||editSig()===p.sig)return;undoSt.push(p);if(undoSt.length>40)undoSt.shift();redoSt.length=0;renderUndo();}
function edit(fn){beginEdit();try{return fn();}finally{endEdit();}}
function restoreSnap(sn){
  const line=S.lines[sn.line];let curPaid=0,snPaid=0;for(const t of line.grid.values())curPaid+=t.paid;for(const e of sn.tiles)snPaid+=e.o.paid;
  const cost=snPaid-curPaid;if(cost>S.money){toast('Inte råd att ångra: det kostar '+fmt(cost)+' kr');return false;}
  S.money-=cost;line.grid=new Map();
  for(const e of sn.tiles){const o=e.o,nc=JSON.parse(e.cfg);o.x=e.x;o.y=e.y;o.d=e.d;if(o.cfg.rec!==nc.rec){o.buf={};o.busy=false;}if(o.cfg.res!==nc.res)o.q=null;o.cfg=nc;line.grid.set(key(o.x,o.y),o);}
  if(sel&&line.grid.get(key(sel.x,sel.y))!==sel)closeInspector();else if(sel)renderInspector();
  return true;}
function undoRedo(from,to,word){
  if(!from.length){toast(word==='Ångrade'?'Inget att ångra':'Inget att göra om');return;}
  const sn=from[from.length-1];if(sn.line!==S.cur)switchLine(sn.line);
  const cur=snap();if(!restoreSnap(sn))return;from.pop();to.push(cur);toast(word,true);updateAreabar();renderUndo();}
const undo=()=>undoRedo(undoSt,redoSt,'Ångrade'),redo=()=>undoRedo(redoSt,undoSt,'Gjorde om');
function renderUndo(){const u=$('undo'),r=$('redo');if(u)u.disabled=!undoSt.length;if(r)r.disabled=!redoSt.length;}

const chip=(id,act,on,extra)=>`<button class="chip${on?' on':''}" data-act="${act}" data-v="${id}" ${extra||''}><img alt="" src="${itemIcon(id)}">${RES[id].n}</button>`;

function tileFromEvent(e){const r=canvas.getBoundingClientRect();const wx=(e.clientX-r.left-W/2)/cam.z+cam.x,wy=(e.clientY-r.top-H/2)/cam.z+cam.y;return[Math.floor(wx/TS),Math.floor(wy/TS)];}
document.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;canvas.setPointerCapture(e.pointerId);const[tx,ty]=tileFromEvent(e);warned=false;beginEdit();
  if(tool==='select'){const t=tileAt(tx,ty);if(t){moving={t,x:tx,y:ty,moved:false};}else{closeInspector();panning={sx:e.clientX,sy:e.clientY,cx:cam.x,cy:cam.y};canvas.style.cursor='grabbing';}return;}
  if(tool==='area'){areaPress={x:tx,y:ty,t:tileAt(tx,ty),shift:e.shiftKey,moved:false};return;}
  if(tool==='paste'){pasteAt(tx,ty);return;}
  drag={x:tx,y:ty};
  if(tool==='demolish')removeAt(tx,ty);
  else if(tool==='roller'){if(!tileAt(tx,ty))place(tx,ty,'roller',placeDir);}
  else{const t=tileAt(tx,ty);if(t&&t.t===tool){openInspector(t);drag=null;}else place(tx,ty,tool,placeDir);}
});
canvas.addEventListener('pointermove',e=>{
  hover=tileFromEvent(e);
  if(panning){cam.x=panning.cx-(e.clientX-panning.sx)/cam.z;cam.y=panning.cy-(e.clientY-panning.sy)/cam.z;clampCam();return;}
  if(moving){if(hover[0]!==moving.x||hover[1]!==moving.y){moving.moved=true;canvas.style.cursor='grabbing';}return;}
  if(amove){amove.dx=hover[0]-amove.sx;amove.dy=hover[1]-amove.sy;return;}
  if(areaPress&&!areaPress.moved&&(hover[0]!==areaPress.x||hover[1]!==areaPress.y)){const a=areaPress;a.moved=true;
    if(a.t&&selT.has(a.t)){amove={sx:a.x,sy:a.y,dx:0,dy:0};canvas.style.cursor='grabbing';}else areaDrag={x0:a.x,y0:a.y,x1:a.x,y1:a.y,shift:a.shift};}
  if(amove){amove.dx=hover[0]-amove.sx;amove.dy=hover[1]-amove.sy;return;}
  if(areaDrag){areaDrag.x1=hover[0];areaDrag.y1=hover[1];return;}
  if(drag&&(e.buttons&1))dragTo(hover[0],hover[1]);
});
function endDrag(e){const cancel=!e||e.type==='pointercancel';const pt=e&&!cancel?tileFromEvent(e):null;
  if(moving){const m=moving;moving=null;canvas.style.cursor=tool==='select'?'default':'crosshair';if(!m.moved)openInspector(m.t);else if(pt)moveTile(m.t,pt[0],pt[1]);}
  if(amove){const a=amove;amove=null;canvas.style.cursor='crosshair';if(pt){a.dx=pt[0]-a.sx;a.dy=pt[1]-a.sy;}if(!cancel&&(a.dx||a.dy))moveArea(a.dx,a.dy);}
  drag=null;if(areaDrag){if(pt){areaDrag.x1=pt[0];areaDrag.y1=pt[1];}if(!cancel)rectSelect(areaDrag,areaDrag.shift);areaDrag=null;}
  if(areaPress){const a=areaPress;areaPress=null;if(!a.moved&&!cancel&&a.t){if(selT.has(a.t))selT.delete(a.t);else selT.add(a.t);}}
  if(tool==='area')updateAreabar();if(panning){panning=null;canvas.style.cursor=tool==='select'?'default':'crosshair';}endEdit();}
canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);
canvas.addEventListener('pointerleave',()=>{if(!drag&&!panning&&!areaDrag&&!areaPress&&!moving&&!amove)hover=null;});
function dragTo(tx,ty){
  let guard=0;
  while((drag.x!==tx||drag.y!==ty)&&guard++<200){
    const dx=tx-drag.x,dy=ty-drag.y;let sx=0,sy=0;if(Math.abs(dx)>=Math.abs(dy))sx=Math.sign(dx);else sy=Math.sign(dy);
    const nx=drag.x+sx,ny=drag.y+sy,dir=dirOf(sx,sy);
    if(tool==='roller'){const cur=tileAt(drag.x,drag.y);if(cur&&cur.t==='roller')cur.d=dir;placeDir=dir;const nt=tileAt(nx,ny);if(nt){if(nt.t==='roller')nt.d=dir;}else place(nx,ny,'roller',dir,true);updateHint();}
    else if(tool==='demolish')removeAt(nx,ny);
    else if(!tileAt(nx,ny))place(nx,ny,tool,placeDir,true);
    drag.x=nx;drag.y=ny;
  }
}
canvas.addEventListener('wheel',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top);},{passive:false});
function zoomAt(f,sx,sy){const wx=(sx-W/2)/cam.z+cam.x,wy=(sy-H/2)/cam.z+cam.y;cam.z=Math.min(3,Math.max(.35,cam.z*f));cam.x=wx-(sx-W/2)/cam.z;cam.y=wy-(sy-H/2)/cam.z;clampCam();}
function clampCam(){cam.x=Math.min(GWMAX*TS,Math.max(0,cam.x));cam.y=Math.min(GHMAX*TS,Math.max(0,cam.y));}
function centerCam(){cam.x=gw()*TS/2;cam.y=gh()*TS/2;const fit=Math.min((W-60)/(gw()*TS),(H-60)/(gh()*TS));cam.z=Math.min(1.75,Math.max(.4,fit||1));}

window.addEventListener('keydown',e=>{
  const tg=e.target;if(tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.tagName==='SELECT')){if(e.key==='Escape'){tg.blur();closePanel();}return;}
  const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&modal.hidden&&(k==='z'||k==='y')){e.preventDefault();if(k==='y'||e.shiftKey)redo();else undo();return;}

  if(['arrowup','arrowdown','arrowleft','arrowright',' ','tab'].includes(k))e.preventDefault();

  if(k==='t'&&e.shiftKey&&modal.hidden){const ht0=hover&&tileAt(hover[0],hover[1]);if(ht0){clearTiles([ht0],M[ht0.t].n);if(sel===ht0)renderInspector();}return;}
  const pmap={m:'mach',u:'upg',b:'bp',i:'info',t:'stats',h:'help'};
  if(!modal.hidden){if(pmap[k])panel===pmap[k]?closePanel():openPanel(pmap[k]);return;}
  keys.add(k);
  if(e.repeat&&!['+','-','='].includes(k))return;
  if(pmap[k]){openPanel(pmap[k]);return;}
  const ht=hover&&tileAt(hover[0],hover[1]);
  if(cycleKey(k))return;
  beginEdit();
  switch(k){
    case 'q':copyCfg=null;clip=null;setTool('select');break;
    case 'x':setTool('demolish');break;
    case 'v':setTool('area');break;
    case 'delete':case 'backspace':if(tool==='area'&&areaTiles().length)deleteArea();else if(ht)removeAt(ht.x,ht.y);break;
    case 'r':if(tool==='paste'){rotClip();}else if(tool==='area'&&areaTiles().length){rotateSel();}else if(M[tool]){placeDir=(placeDir+1)%4;updateHint();}else{const t=ht||sel;if(t&&!NODIR(t.t))t.d=(t.d+1)%4;}break;
    case 'c':if(tool==='area'&&areaTiles().length)copyArea();else if(ht)copyFrom(ht);break;
    case 'e':if(ht)openInspector(ht);break;
    case 'l':switchLine((S.cur+1)%S.lines.length);break;
    case '+':case '=':zoomAt(1.15,W/2,H/2);break;
    case '-':zoomAt(1/1.15,W/2,H/2);break;
    case ' ':centerCam();break;
    case 'p':paused=!paused;$('paused').hidden=!paused;break;
  }
  endEdit();
});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
window.addEventListener('blur',()=>keys.clear());

/* ============ SAVE ============ */
const SAVE_KEY='fabriksgolvet-v2';
function serialize(){return{v:2,money:S.money,upg:S.upg,raw:S.raw,rec:S.rec,unl:S.unl,total:S.total,sold:S.sold,cur:S.cur,rate:currentRate(),t:Date.now(),ls:lastStarterRes,lr:lastRec,
  lines:S.lines.map(l=>({land:l.land||0,tiles:[...l.grid.values()].map(t=>[t.t,t.x,t.y,t.d,t.cfg,t.paid])}))};}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(serialize()));}catch(e){}}
function exportCode(){try{return btoa(unescape(encodeURIComponent(JSON.stringify(serialize()))));}catch(e){return'';}}
function loadData(d){
  S.money=d.money;S.upg=d.upg||{};S.raw=d.raw||{copper:1};S.rec=d.rec||{};S.unl=d.unl||{roller:1,starter:1,seller:1};S.total=d.total||0;S.sold=d.sold||{};
  lastStarterRes=d.ls||'copper';lastRec=d.lr||null;
  S.lines=(d.lines||[[]]).map(en=>{const old=Array.isArray(en),arr=old?en:(en.tiles||[]);const line={grid:new Map(),land:old?((d.upg&&d.upg.land)||0):(en.land||0)};for(const[t,x,y,dd,cfg,paid]of arr)if(M[t])line.grid.set(key(x,y),mk(t,x,y,dd,cfg,paid,line));return line;});
  if(!S.lines.length)S.lines=[{grid:new Map(),land:0}];
  undoSt.length=0;redoSt.length=0;pendingEdit=null;
  S.cur=Math.min(d.cur||0,S.lines.length-1);closeInspector();selT.clear();clip=null;renderLines();refreshToolbar();floorLand=-1;
}
function newGame(){
  S.money=1000;S.upg={};S.raw={copper:1};S.rec={};S.unl={roller:1,starter:1,seller:1};S.total=0;S.sold={};lastStarterRes='copper';lastRec=null;earnWin=[];
  undoSt.length=0;redoSt.length=0;pendingEdit=null;
  const line={grid:new Map(),land:0};S.lines=[line];S.cur=0;
  line.grid.set(key(2,3),mk('starter',2,3,0,{res:'copper'},100,line));
  for(let x=3;x<=6;x++)line.grid.set(key(x,3),mk('roller',x,3,0,null,10,line));
  line.grid.set(key(7,3),mk('seller',7,3,0,null,100,line));
  closeInspector();renderLines();refreshToolbar();floorLand=-1;centerCam();save();
}
let offlineInfo=null;
function applyOffline(secs,rate){
  if(secs<30||rate<=0)return;const s=Math.min(secs,8*3600),amt=rate*s*(25+15*lv('night'))/100;if(amt<1)return;
  S.money+=amt;S.total+=amt;const hh=Math.floor(s/3600),mm=Math.floor(s%3600/60);
  offlineInfo={amount:amt,time:hh?hh+' h '+mm+' min':mm?mm+' min':Math.floor(s)+' s'};openPanel('offline');
}
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();save();}else if(hiddenAt){applyOffline((Date.now()-hiddenAt)/1000,currentRate());hiddenAt=0;}});
window.addEventListener('beforeunload',save);

/* ============ LOOP ============ */
let lastT=performance.now(),uiAcc=0,saveAcc=0;
function frame(now){
  const dt=Math.min(.1,(now-lastT)/1000);lastT=now;
  if(!paused){time+=dt;update(dt);}
  const pan=650*dt/cam.z;
  if(keys.has('w')||keys.has('arrowup'))cam.y-=pan;if(keys.has('s')||keys.has('arrowdown'))cam.y+=pan;
  if(keys.has('a')||keys.has('arrowleft'))cam.x-=pan;if(keys.has('d')||keys.has('arrowright'))cam.x+=pan;clampCam();
  render();
  uiAcc+=dt;if(uiAcc>.2){uiAcc=0;$('money').textContent=fmt(S.money)+' kr';$('rate').textContent=fmt(currentRate())+' kr/s';
    $('startc').textContent=starterCount()+'/'+maxStarters();refreshToolbar();updateLive();refreshPanel();
    for(const nb of linesEl.querySelectorAll('[data-cost]'))nb.disabled=S.money<+nb.dataset.cost;renderUndo();}
  saveAcc+=dt;if(saveAcc>5){saveAcc=0;save();}
  requestAnimationFrame(frame);
}
function start(data){
  buildSprites();resize();buildToolbar();setTool('select');
  let d=data&&data.save;
  if(!d){try{const raw=localStorage.getItem(SAVE_KEY);if(raw)d=JSON.parse(raw);}catch(e){}}
  if(d&&d.lines){loadData(d);centerCam();if(!(data&&data.save))applyOffline((Date.now()-(d.t||Date.now()))/1000,d.rate||0);}
  else{newGame();setTimeout(()=>toast('Tryck H för hjälp. Lås upp maskiner med M.',true),700);}
  window.addEventListener('resize',resize);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{});
  requestAnimationFrame(frame);
}
try{window.claude?.hot?.snapshot?.(()=>({save:serialize()}));}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
