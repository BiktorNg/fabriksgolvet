<style>
/* Layout: pixelfabrik i helskärm. Statusrad + linjeflikar överst, maskinlist nederst, paneler som pixelrutor över golvet */
:root{
  --bg:#141518; --panel:#2a2d34; --hi:#41464f; --lo:#16181b; --edge:#0b0c0e;
  --btn:#454a54; --btnhi:#5c626e; --ink:#f2ecda; --muted:#a8a190; --gold:#ffcc33; --money:#9be36d; --bad:#ff6b57; --blue:#7fd0ff;
  --px:"Pixelify Sans","Courier New",monospace; --head:"Silkscreen","Courier New",monospace; --num:"VT323","Courier New",monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--px);font-size:15px;overflow:hidden;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
.bar{display:flex;align-items:center;gap:14px;padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);flex-shrink:0;overflow-x:auto;scrollbar-width:thin;box-shadow:inset 0 2px 0 var(--hi),inset 0 -2px 0 var(--lo)}
.top{border-bottom:3px solid var(--edge)}
.lines{border-bottom:3px solid var(--edge);background:#202328;padding-block:5px;gap:6px}
.tools{border-top:3px solid var(--edge);gap:6px;padding-block:6px;align-items:stretch}
.brand{font-family:var(--head);font-weight:700;font-size:20px;letter-spacing:.02em;color:var(--gold);text-shadow:2px 2px 0 #000;flex-shrink:0;line-height:1}
.stat{display:flex;flex-direction:column;line-height:1.05;flex-shrink:0;background:var(--lo);padding:4px 10px;box-shadow:inset 2px 2px 0 #000,inset -2px -2px 0 var(--hi)}
.lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.num{font-family:var(--num);font-weight:400;font-size:26px;line-height:.95;letter-spacing:.03em;font-variant-numeric:tabular-nums;text-shadow:2px 2px 0 #000}
.money .num{color:var(--money);font-size:30px}
.spacer{flex:1}
.navbtns{display:flex;gap:6px;flex-shrink:0}
button{font:inherit;font-family:var(--px);font-weight:500;color:var(--ink);background:var(--btn);border:0;border-radius:0;padding:6px 10px;cursor:pointer;white-space:nowrap;box-shadow:inset 2px 2px 0 var(--btnhi),inset -2px -3px 0 rgba(0,0,0,.45),0 0 0 2px var(--edge)}
button:hover:not(:disabled){background:#525865}
button:active:not(:disabled){box-shadow:inset 2px 3px 0 rgba(0,0,0,.45),0 0 0 2px var(--edge);transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
button:disabled{opacity:.45;cursor:not-allowed}
button.gold{background:#a7801a;box-shadow:inset 2px 2px 0 #e0b23a,inset -2px -3px 0 rgba(0,0,0,.45),0 0 0 2px var(--edge);color:#fff6d8}
button.red{background:#8a3a30;box-shadow:inset 2px 2px 0 #b8564a,inset -2px -3px 0 rgba(0,0,0,.45),0 0 0 2px var(--edge)}
kbd{font-family:var(--px);font-weight:700;font-size:11px;background:#111;color:var(--gold);padding:0 4px;margin-right:6px;box-shadow:inset -1px -2px 0 #333}
.linetab{padding:4px 10px;font-size:14px}
.lsep{width:2px;align-self:stretch;background:var(--edge);flex-shrink:0}
.linetab.on{background:#a7801a;box-shadow:inset 2px 2px 0 #e0b23a,inset -2px -3px 0 rgba(0,0,0,.45),0 0 0 2px var(--edge)}
.grp{display:flex;flex-direction:column;gap:3px;flex-shrink:0}
.grp .gl{font-family:var(--head);font-size:10px;color:var(--muted);padding-left:2px}
.grp .gb{display:flex;gap:6px}
.tool{display:flex;flex-direction:column;align-items:center;gap:1px;width:78px;padding:4px 3px 3px;position:relative;flex-shrink:0}
.tool img{width:32px;height:32px;image-rendering:pixelated}
.tool .tn{font-size:11.5px;line-height:1.05;white-space:normal;text-align:center;min-height:2.1em;display:flex;align-items:center}
.tool .tc{font-family:var(--num);font-size:17px;line-height:1;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:clip;max-width:100%;color:var(--money);font-variant-numeric:tabular-nums}
.tool kbd{position:absolute;top:2px;left:2px;margin:0}
.tool .var{position:absolute;top:2px;right:3px;font-family:var(--num);font-size:15px;line-height:1;color:var(--blue)}
.tool.on{background:#6e5a1a;box-shadow:inset 2px 2px 0 var(--gold),inset -2px -3px 0 rgba(0,0,0,.5),0 0 0 2px var(--edge)}
.tool.poor .tc{color:var(--bad)}
.tool.lock{opacity:.6}
.tool.lock img{filter:grayscale(1) brightness(.6)}
.tool.lock .tc{color:var(--gold)}
@media (max-width:1560px){.navbtns kbd{display:none}}
@media (max-width:1320px){.tool{width:72px}.tools{gap:5px}.grp .gb{gap:5px}}
@media (max-width:1400px){.navbtns button{padding:6px 7px}.navbtns kbd{margin-right:4px}.bar{gap:10px}.stat{padding:3px 8px}.num{font-size:23px}.money .num{font-size:26px}}
/* compact layouts for small game windows (CrazyGames iframe sizes) */
.ns{display:none}
body.cmp .brand{display:none}
body.cmp .bar{gap:8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
body.cmp .stat{padding:2px 7px}body.cmp .num{font-size:21px}body.cmp .money .num{font-size:23px}
body.cmp .navbtns{gap:5px}body.cmp .navbtns button{padding:5px 6px}
body.cmp .tools,body.cmp .grp .gb{gap:4px}
body.cmp .grp{flex:1 1 auto}body.cmp .tool{width:auto;flex:1 1 0;min-width:46px;max-width:76px;padding:3px 2px 2px}
body.xs .tool .tn,body.short .tool .tn{display:none}
body.xs .tool img,body.short .tool img{width:28px;height:28px;margin-top:6px}
body.cmp .tool .tc{font-size:16px}
body.cmp .linetab{padding:4px 8px}
body.xs .nl,body.xs .xl{display:none}body.xs .ns{display:inline}
body.xs .stat .lbl{font-size:10px}body.xs .num{font-size:19px}body.xs .money .num{font-size:21px}
body.xs .tools,body.xs .grp .gb{gap:3px}body.xs .tool .tc{font-size:15px}
body.short .grp .gl{display:none}
body.short .bar.top{padding-block:4px}body.short .lines{padding-block:3px}body.short .tools{padding-block:4px}
body.short #modal{padding:10px 12px}body.short .sheet{padding:12px 14px 14px}body.short .shh h2{font-size:20px}
body.short #insp{top:8px;right:8px;max-height:calc(100% - 16px);padding:10px}
body.short #tut:not(.docked){top:8px}
body.short #zoom{flex-direction:row;bottom:48px;gap:6px}body.short #zoom button{width:32px;height:30px;font-size:20px}body.short #zoom button.small{height:30px;width:auto;padding:0 8px;font-size:12px}
#order{position:absolute;top:14px;left:max(14px,env(safe-area-inset-left,0px));width:240px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
body.short #order{top:8px;width:224px;padding:6px 8px;gap:4px}
#order .oh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--muted)}#order .oh b{font-family:var(--head);font-weight:400;color:var(--gold);font-size:11px;text-transform:uppercase}
#order .orow{display:flex;gap:8px;align-items:center}#order .orow img{width:32px;height:32px;image-rendering:pixelated;flex:none}
#order .on{font-weight:600;line-height:1.15}#order .om{font-family:var(--num);font-size:18px;line-height:1.1;color:var(--muted)}#order .om b{color:var(--ink);font-weight:400}
#order .row{display:flex;gap:6px}#order .row button{flex:1;padding:4px 6px}
.obar{height:7px;background:var(--lo);box-shadow:inset 1px 1px 0 #000}.obar i{display:block;height:100%;background:var(--money)}
.linetab.lwarn{position:relative}.linetab.lwarn::after{content:'';position:absolute;top:-3px;right:-3px;width:7px;height:7px;background:var(--gold);box-shadow:0 0 0 2px var(--edge)}
.graphwrap{background:var(--lo);box-shadow:inset 2px 2px 0 #000,inset -2px -2px 0 var(--hi);padding:6px}
#st-graph{display:block;width:100%;height:150px}
tr.curl td{color:var(--gold)}
.setrow{display:grid;grid-template-columns:150px 1fr 60px;gap:12px;align-items:center;margin:8px 0;max-width:560px}
.setrow span{font-family:var(--num);font-size:19px;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;height:10px;background:var(--lo);box-shadow:inset 2px 2px 0 #000;outline:none;width:100%;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:22px;background:var(--gold);box-shadow:inset -2px -3px 0 rgba(0,0,0,.4),0 0 0 2px var(--edge)}
input[type=range]::-moz-range-thumb{width:16px;height:22px;background:var(--gold);border:0;border-radius:0;box-shadow:0 0 0 2px var(--edge)}
input[type=range]:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
#setbtn{padding:5px 7px}#setbtn img{width:18px;height:18px;image-rendering:pixelated;display:block}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#101114}
#floor{display:block;position:absolute;inset:0;cursor:crosshair;touch-action:none;image-rendering:pixelated}
.pxbox{background:var(--panel);box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--lo),0 0 0 3px var(--edge),6px 6px 0 rgba(0,0,0,.45)}
#zoom{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:56px;display:flex;flex-direction:column;gap:8px;align-items:center}
#zoom button{width:40px;height:38px;padding:0;font-size:24px;line-height:1;font-weight:700}
#zoom button.small{height:30px;font-size:12px}
#zoom .zl{font-family:var(--num);font-size:15px;color:var(--muted);text-shadow:1px 1px 0 #000}
#insp{position:absolute;top:14px;right:14px;width:320px;max-width:calc(100% - 28px);max-height:calc(100% - 28px);overflow:auto;padding:12px}
.ih{display:flex;gap:10px;align-items:flex-start}

function mk(t,x,y,d,cfg,paid,line){
  const o={t,x,y,d,cfg:cfg?JSON.parse(JSON.stringify(cfg)):{},paid:paid||0,line,its:[],qw:0,qn:0,wq:0,energy:0,inp:null,q:null,timer:0,buf:{},cb:[],busy:false,hold:null,idx:0,tq:[],oq:[]};
  if(t==='starter'&&!o.cfg.res)o.cfg.res=lastStarterRes;
  if(t==='radstarter'&&!o.cfg.res)o.cfg.res='uranium';
  if((t==='lsel'||t==='rsel')&&!o.cfg.res)o.cfg.res='copper';
  if(t==='msel'){if(!o.cfg.l)o.cfg.l='copper';if(!o.cfg.r)o.cfg.r='iron';}
  if(t==='asplit'&&!o.cfg.ratio)o.cfg.ratio=[1,1,1];
  if((t==='tin'||t==='tout'||t==='atin'||t==='atout')&&!o.cfg.ch)o.cfg.ch=1;
  if(t.startsWith('crafter')&&o.cfg.rec===undefined){const mkv=M[t].mk;o.cfg.rec=(lastRec&&S.rec[lastRec]&&RECMAP[lastRec].tier<=mkv)?lastRec:(RECIPES.find(r=>S.rec[r.id]&&r.tier<=mkv)||{}).id||null;}
  return o;
}
let warned=false;
function canPlace(x,y,t,silent){
  const say=m=>{if(!silent||!warned){toast(m);warned=true;}return false;};
  if(!S.unl[t])return say(M[t].n+tr(' är låst. Lås upp den under Maskiner (M).',' is locked. Unlock it under Machines (M).'));
  if(!inBounds(x,y))return silent?false:say(tr('Utanför linjen. Köp Större yta i raden med linjer.','Outside the line. Buy Bigger area in the line bar.'));
  if(tileAt(x,y))return false;
  if(isStarter(t)&&starterCount()>=maxStarters())return say(tr('Max antal startare på linjen. Uppgradera Fler startare.','Max starters on this line. Upgrade More starters.'));
  const c=machineCost(t);if(S.money<c)return say(tr('Inte råd: ','Can\'t afford: ')+M[t].n+tr(' kostar ',' costs ')+cash(c));
  return true;
}
function place(x,y,t,d,silent,cfg){
  if(!canPlace(x,y,t,silent))return false;
  const c=machineCost(t);S.money-=c;
  const use=cfg||((copyCfg&&copyCfg.t===t)?copyCfg.cfg:null);
  const o=mk(t,x,y,d,use,c,L());L().grid.set(key(x,y),o);sfx('place');
  if(t.startsWith('crafter')&&!silent&&!cfg)openInspector(o);
  return true;
}

  t.its=[];t.q=null;t.qn=0;t.wq=0;t.qw=0;t.inp=null;t.hold=null;t.buf={};t.cb=[];t.busy=false;t.timer=0;t.tq=[];t.oq=[];t.wrong=null;return n;}

const isProc=t=>PROC.includes(t);
function accept(t,item,travel){
  const from=(travel+2)%4,back=(t.d+2)%4;
  switch(t.t){
    case 'roller':{if(t.d===from||t.its.length>=72)return false;let c=0;for(const a of t.its)if(a.item===item&&++c>=24)return false;t.its.push({item,prog:0,from});return true;}
    case 'seller':if(item==='waste')return false;sell(item,t);return true;
    case 'disposal':if(item!=='waste')return false;t.n=(t.n||0)+1;S.stats.waste=(S.stats.waste||0)+1;return true;
    case 'wire':case 'furnace':case 'cutter':case 'press':
      if(t.d===from||t.inp||RES[item].kind!=='raw')return false;t.inp=item;t.timer=0;return true;
    case 'cable':
      if(t.d===from||t.busy||RES[item].kind!=='wire'||t.cb.length>=3||(t.cb.length&&t.cb[0]!==item))return false;t.cb.push(item);return true;
    case 'crafter1':case 'crafter2':case 'crafter3':case 'crafter4':case 'crafter5':{
      if(t.d===from)return false;
      if(item==='energy'&&M[t.t].rad){if(t.energy>=20)return false;t.energy++;return true;}
      if(!t.cfg.rec||RECMAP[t.cfg.rec].tier>M[t.t].mk)return false;const need=RECMAP[t.cfg.rec].in[item];
      if(!need){t.wrong=item;t.wrongAt=time;return false;}if((t.buf[item]||0)>=need*2)return false;t.buf[item]=(t.buf[item]||0)+1;return true;}
    case 'splitter':case 'lsplit':case 'rsplit':case 'asplit':case 'lsel':case 'rsel':case 'msel':
      if(from!==back||t.hold)return false;t.hold=item;t.timer=0;return true;
    case 'centrifuge':if(t.d===from)return false;if(item==='energy'){if(t.energy>=10)return false;t.energy++;return true;}
      if(RES[item].kind!=='rad'||t.busy||t.cb.length>=3||(t.cb.length&&t.cb[0]!==item))return false;t.cb.push(item);return true;
    case 'recycler':if(t.d===from||item!=='waste'||t.busy||t.cb.length>=4)return false;t.cb.push(item);return true;
    case 'refinery':if(t.d===from||t.inp||!(item in REFINE))return false;t.inp=item;t.timer=0;return true;
    case 'tin':case 'atin':if(t.tq.length>=3)return false;t.tq.push({item,age:0});return true;
  }
  return false;
}
const nbr=(t,dir)=>t.line.grid.get(key(t.x+DIRS[dir][0],t.y+DIRS[dir][1]));
function push(t,item,dir){const n=nbr(t,dir);return n?accept(n,item,dir):false;}
function routeCycle(t,outs){const n=outs.length;for(let k=0;k<n;k++){const o=outs[(t.idx+k)%n];if(!nbr(t,o))continue;if(push(t,t.hold,o)){t.hold=null;t.idx=(t.idx+k+1)%n;return;}}}
function earn(v){earnBucket+=v;if(v>0)S.total+=v;}
function sell(item,t){t.ns=(t.ns||0)+1;
  const v=RES[item].v*priceMult();S.money+=v;earn(v);S.sold[item]=(S.sold[item]||0)+1;salesAcc[item]=(salesAcc[item]||0)+1;valAcc[item]=(valAcc[item]||0)+v;
  t.line._acc=(t.line._acc||0)+v;ordSold(item);if(t.line===L())sfx('sell');
  if(SET.floats&&t.line===L()&&floats.length<60)floats.push({x:t.x*TS+TS/2+(Math.random()*20-10),y:t.y*TS+6-Math.random()*8,txt:'+'+cash(v),life:1});
}
let gOuts=new Map();
function stepLine(line,dt){
  const outs=new Map();
  for(const t of line.grid.values())if(t.t==='tout'){if(!outs.has(t.cfg.ch))outs.set(t.cfg.ch,[]);outs.get(t.cfg.ch).push(t);}
  for(const t of line.grid.values()){
    switch(t.t){
      case 'roller':if(t.its.length){const bsp=beltSpeed(tl(t)),its=t.its;let w=0;for(let i=0;i<its.length;i++){const a=its[i];a.prog=Math.min(1,a.prog+bsp*dt);if(a.prog>=1&&push(t,a.item,t.d))continue;its[w++]=a;}its.length=w;}break;
      case 'starter':if(!t.q){t.timer+=dt;if(t.timer>=spawnInt(tl(t))){t.q=t.cfg.res;t.timer=0;}}if(t.q&&push(t,t.q,t.d))t.q=null;break;
      case 'radstarter':if(!t.q){t.timer+=dt;if(t.timer>=radInt(tl(t))){t.q=t.cfg.res;t.timer=0;}}if(t.q&&push(t,t.q,t.d))t.q=null;break;
      case 'centrifuge':
        if(!t.busy&&!t.q&&t.cb.length===3&&t.energy>=1){t.busy=true;t.timer=0;t.energy--;}
        if(t.busy){t.timer+=dt;if(t.timer>=centTime(tl(t))){t.q=CENTRI[t.cb[0]];t.cb=[];t.busy=false;}}
        if(t.q&&push(t,t.q,t.d))t.q=null;break;
      case 'recycler':
        if(!t.busy&&!t.q&&t.cb.length===4){t.busy=true;t.timer=0;}
        if(t.busy){t.timer+=dt;if(t.timer>=centTime(tl(t))){S.stats.waste=(S.stats.waste||0)+4;t.q='plutonium';t.cb=[];t.busy=false;}}
        if(t.q&&push(t,t.q,t.d))t.q=null;break;
      case 'refinery':
        if(t.inp&&!t.q){t.timer+=dt;if(t.timer>=refTime(tl(t))){t.q='energy';t.qn=REFINE[t.inp]||1;t.inp=null;t.timer=0;}}

function rotateSel(){const ts=areaTiles();if(!ts.length)return;const[x0,y0,x1,y1]=areaRect(),h=y1-y0+1,set=new Set(ts),np=new Map();
  const cx=(x0+x1)/2,cy=(y0+y1)/2;let mx0=1e9,my0=1e9,mx1=-1e9,my1=-1e9;

function inspClick(e){

  else if(a==='rec'){if(t.cfg.rec!==v){t.cfg.rec=v;t.buf={};t.busy=false;lastRec=v;}}

  else if(a==='ch')t.cfg.ch=+v;

<li>A <b>starter</b> creates raw materials. The yellow-black edge is its output.</li><li>Drag <b>conveyors</b> from the output to a <b>seller</b>.</li>
<li>Process materials in a wire drawer, furnace, cutter or hydraulic press. That makes them worth more.</li>
<li>Buy <b>blueprints</b> and let a <b>crafter</b> build products from several parts. Harder blueprints need MK2 or MK3.</li>
<li>Sort with <b>filters</b>, split flows with <b>splitters</b> and move items far with <b>transporters</b>.</li>
<li>When you can afford it, unlock the <b>radioactive</b> tier. Radioactive starters make uranium and plutonium. The <b>centrifuge</b> enriches them (3 → 1, costs energy) and the <b>refinery</b> makes energy cells. Radioactive crafters need energy and leave <b>radioactive waste</b> after every product. Waste can't be sold: sort it out with a filter to a <b>waste disposal</b>, or to a <b>recycler</b> that turns it into plutonium.</li>
<li><b>Line transporters</b> (key G) send items between lines. That way one line can make parts for another, which the biggest products need.</li>
<li>Color belts in the belt's settings, or select many with V and pick a color.</li>
<li>Now and then an <b>order</b> shows up in the top left. Accept it and sell the right amount before time runs out to earn an extra bonus. A yellow <b>!</b> marks machines and belts that are stuck.</li>
<li>Buy a <b>bigger area</b> for a line, or more <b>lines</b> when a factory is full. All lines run at once, even while you're away.</li></ol>
<p>An item a machine doesn't want stops the belt. Use filters to send the right item to the right machine. If the wrong item is stuck, press <b>Empty</b> in the machine's settings, empty selected machines with <b>V</b>, or empty all belts on the line from the line bar.</p></div>

function tutIssues(){
  const i=S.tut.i,E=new Map(),C=new Map();for(let k=0;k<i;k++)for(const g of TUT[k].tiles||[])E.set(key(g.x,g.y),g);
  for(const g of TUT[i].tiles||[])C.set(key(g.x,g.y),g);
  const r={missing:[],remove:[],rotate:[],res:[]};
  for(const[k,g]of E){if(C.has(k))continue;const o=tg().get(k);if(!o)r.missing.push(g);else if(o.t!==g.t)r.remove.push(o);else if(!tmatch(o,g))r.rotate.push([o,g]);else if(g.res&&o.cfg.res!==g.res)r.res.push([o,g]);}
  for(const[k,g]of C){const o=tg().get(k);if(o&&o.t!==g.t)r.remove.push(o);else if(o&&!tmatch(o,g))r.rotate.push([o,g]);}
  for(const o of tg().values()){const k=key(o.x,o.y);if(!E.has(k)&&!C.has(k))r.remove.push(o);}
  r.any=r.missing.length+r.remove.length+r.rotate.length+r.res.length>0;return r;
}

// calm generative chiptune: Am F C G, bass + soft arpeggio + sparse melody
const MUS={timer:null,next:0,step:0};
const NOTE=n=>440*Math.pow(2,(n-69)/12);
const PROG=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],MEL=[69,72,74,76,79,81,84];
function musStart(){if(MUS.timer)return;MUS.next=AU.ctx.currentTime+.4;MUS.timer=setInterval(musTick,120);}
function musTick(){
  const c=AU.ctx;if(!c||c.state!=='running')return;const spb=60/84/2;
  if(MUS.next<c.currentTime-.05)MUS.next=c.currentTime+.05;
  if(SET.mus<=0){MUS.next=c.currentTime+.05;return;}
  while(MUS.next<c.currentTime+.45){
    const s=MUS.step,bar=Math.floor(s/16)%PROG.length,ch=PROG[bar],i=s%16,d=MUS.next-c.currentTime;
    if(i%8===0)tone(NOTE(ch[0]-12),0,spb*7.6,'triangle',.24,d,AU.mus);
    if(i%2===0)tone(NOTE(ch[(i/2)%3]+12),0,spb*1.7,'square',.028,d,AU.mus);
    if((i===4||i===10||(i===14&&bar%2))&&Math.random()<.65)tone(NOTE(MEL[(s*5+bar*3)%MEL.length]),0,spb*2.6,'triangle',.07,d,AU.mus);
    MUS.step++;MUS.next+=spb;
  }
}

function ordGen(){
  const c=Object.keys(ema).filter(id=>id!=='waste'&&RES[id]&&ema[id]>.03);if(!c.length)return null;
  let tot=0;const w=c.map(id=>{const x=Math.sqrt(emaV[id]||ema[id]*RES[id].v)+1;tot+=x;return x;});
  let r=Math.random()*tot,id=c[0];for(let i=0;i<c.length;i++){r-=w[i];if(r<=0){id=c[i];break;}}
  const dur=[180,240,300][Math.floor(Math.random()*3)];
  const qty=Math.max(5,Math.round(ema[id]*dur*(1.25+Math.random()*.35)));
  const reward=niceRound(Math.max(qty*RES[id].v*priceMult()*.8,currentRate()*dur*.2,150));
  return{st:'offer',item:id,qty,got:0,dur,left:60,reward};
}
function ordTick(dt){
  if(ordBlocked())return;
  const o=S.ord;
  if(!o){S.ordNext=(S.ordNext==null?150:S.ordNext)-dt;if(S.ordNext<=0){S.ord=ordGen();S.ordNext=null;if(S.ord){sfx('order');ordRender(true);}else S.ordNext=60;}return;}
  o.left-=dt;
  if(o.left<=0){const act=o.st==='active';if(act){toast(tr('Beställningen hann inte bli klar','The order ran out of time'),false,true);sfx('fail');}
    S.ord=null;S.ordNext=act?150+Math.random()*90:100+Math.random()*60;ordRender(true);}
}
function ordSold(id){
  const o=S.ord;if(!o||o.st!=='active'||o.item!==id)return;o.got++;
  if(o.got>=o.qty){S.money+=o.reward;S.total+=o.reward;S.stats.orders=(S.stats.orders||0)+1;toast(tr('Beställning klar! +','Order complete! +')+cash(o.reward),true);sfx('done');S.ord=null;S.ordNext=150+Math.random()*90;ordRender(true);}
}
const mmss=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
function ordRender(full){
  const o=S.ord,show=!!o&&!ordBlocked();ordEl.hidden=!show;if(!show){ordEl.dataset.st='';return;}
  if(full||ordEl.dataset.st!==o.st||ordEl.dataset.it!==o.item){ordEl.dataset.st=o.st;ordEl.dataset.it=o.item;
    ordEl.innerHTML=`<div class="oh"><b>${tr('Beställning','Order')}</b><span id="o-t"></span></div><div class="orow"><img alt="" src="${itemIcon(o.item)}"><div><div class="on">${o.st==='offer'?fmt(o.qty)+' × ':''}${RES[o.item].n}</div><div class="om" id="o-m"></div></div></div>`+
      (o.st==='offer'?`<div class="row"><button class="gold" data-ord="yes">${tr('Acceptera','Accept')}</button><button data-ord="no">${tr('Nej tack','No thanks')}</button></div>`:`<div class="obar"><i id="o-b"></i></div>`);}
  $('o-t').textContent=o.st==='offer'?tr('Svara inom ','Reply within ')+mmss(o.left):mmss(o.left)+tr(' kvar',' left');
  $('o-m').innerHTML=o.st==='offer'?tr('Tid ','Time ')+mmss(o.dur)+` · <span class="ok">+${cash(o.reward)}</span>`:`<b>${fmt(o.got)}</b> / ${fmt(o.qty)} · <span class="ok">+${cash(o.reward)}</span>`;
  if(o.st==='active')$('o-b').style.width=(100*Math.min(1,o.got/o.qty)).toFixed(1)+'%';
}
ordEl.addEventListener('click',e=>{const b=e.target.closest('[data-ord]');if(!b||!S.ord)return;
  if(b.dataset.ord==='yes'){S.ord.st='active';S.ord.left=S.ord.dur;S.ord.got=0;sfx('buy');}else{S.ord=null;S.ordNext=120+Math.random()*60;}
  ordRender(true);save();});

/* ============ WARNINGS ============ */
const SPLITS=['splitter','lsplit','rsplit','asplit','lsel','rsel','msel'];
function never(n,item,travel){ // n can never take this item from this side
  const from=(travel+2)%4,R=RES[item]||{};
  if(n.t==='roller')return n.d===from;
  if(n.t==='seller')return item==='waste';
  if(n.t==='disposal')return item!=='waste';
  if(n.t==='tin'||n.t==='atin')return false;
  if(SPLITS.includes(n.t))return from!==(n.d+2)%4;
  if(n.d===from)return true;
  switch(n.t){
    case 'wire':case 'furnace':case 'cutter':case 'press':return R.kind!=='raw';
    case 'cable':return R.kind!=='wire';
    case 'refinery':return !(item in REFINE);
    case 'centrifuge':return item!=='energy'&&R.kind!=='rad';
    case 'recycler':return item!=='waste';
    case 'crafter1':case 'crafter2':case 'crafter3':case 'crafter4':case 'crafter5':{if(item==='energy')return !M[n.t].rad;const r=n.cfg.rec&&RECMAP[n.cfg.rec];return !r||r.tier>M[n.t].mk||!r.in[item];}
  }
  return true;
}
function issue(t){
  if(t.t==='roller'){const s=t.its.find(a=>a.prog>=1);if(!s)return false;const n=nbr(t,t.d);return !n||never(n,s.item,t.d);}
  if(t.wrong&&time-(t.wrongAt||0)<1.5)return true;
  const it=t.q||(t.wq?'waste':null);if(it&&t.qw>=1){const n=nbr(t,t.d);return !n||never(n,it,t.d);}
  if(t.t==='centrifuge'&&t.energy<1&&t.cb.length===3)return true;
  if(M[t.t].rad&&t.cfg.rec){const r=RECMAP[t.cfg.rec];if(r&&r.en&&(t.energy||0)<r.en&&Object.keys(r.in).every(k=>(t.buf[k]||0)>=r.in[k]))return true;}
  return false;
}
let warnAcc=0;
function warnScan(dt){warnAcc+=dt;if(warnAcc<.5)return;const d=warnAcc;warnAcc=0;
  for(const l of S.lines){let n=0;for(const t of l.grid.values()){t._wt=issue(t)?(t._wt||0)+d:0;if(t._wt>=2)n++;}l._wn=n;}}
const WARN_MAP=['....k....','...kyk...','...kyk...','..kykyk..','..kykyk..','.kyyyyyk.','.kyykyyk.','kkkkkkkkk'];
function drawWarn(g,x,y){for(let r=0;r<WARN_MAP.length;r++)for(let c=0;c<9;c++){const ch=WARN_MAP[r][c];if(ch==='.')continue;g.fillStyle=ch==='k'?K:Y;g.fillRect(x+c*3,y+r*3,3,3);}}
function drawWarnings(g,vis){if(!SET.warn||(typeof tutOn==='function'&&tutOn()))return;const bob=Math.round(Math.sin(time*4)*1.5);for(const t of vis)if(t._wt>=2)drawWarn(g,t.x*TS+TS-22,t.y*TS-10+bob);}
function lineBadges(){const bs=linesEl.querySelectorAll('[data-line]');bs.forEach(b=>{const l=S.lines[+b.dataset.line];b.classList.toggle('lwarn',!!(SET.warn&&l&&l._wn));});}

/* ============ LINE INCOME + HISTORY ============ */
const lineRate=l=>l._win&&l._win.length?l._win.reduce((a,b)=>a+b,0)/l._win.length:0;
function lineSecond(){for(const l of S.lines){(l._win||(l._win=[])).push(l._acc||0);l._acc=0;if(l._win.length>60)l._win.shift();}}
let hsA=0,hlA=0,graphRange='m10';
function histTick(dt){
  if(!S.hist)S.hist={s:[],l:[]};hsA+=dt;hlA+=dt;
  if(hsA>=10){hsA=0;S.hist.s.push(Math.round(currentRate()));if(S.hist.s.length>360)S.hist.s.shift();}
  if(hlA>=300){hlA=0;const a=S.hist.s.slice(-30);S.hist.l.push(Math.round(a.reduce((x,y)=>x+y,0)/Math.max(1,a.length)));if(S.hist.l.length>288)S.hist.l.shift();}
}
function drawGraph(){
  const cv=$('st-graph');if(!cv)return;const w=cv.parentElement.clientWidth-12,h=150,dpr=window.devicePixelRatio||1;if(w<50)return;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);}
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
  const Hs=S.hist||{s:[],l:[]},R={m10:[Hs.s,60,'−10 min'],h1:[Hs.s,360,'−1 h'],d1:[Hs.l,288,'−24 h']}[graphRange];
  const data=R[0].slice(-R[1]).concat([Math.round(currentRate())]),N=R[1]+1;
  const pl=64,pr=8,pt=10,pb=20,gw=w-pl-pr,gh=h-pt-pb,max=Math.max(10,...data)*1.12;
  g.font='16px VT323,monospace';g.textBaseline='middle';
  for(let i=0;i<=4;i++){const y=Math.round(pt+gh*(1-i/4));g.fillStyle='#2f333a';g.fillRect(pl,y,gw,1);g.fillStyle='#a8a190';g.textAlign='right';g.fillText(SV?fmtS(max*i/4)+' kr':'$'+fmtS(max*i/4),pl-6,y);}
  g.textAlign='left';g.fillText(R[2],pl,h-8);g.textAlign='right';g.fillText(tr('nu','now'),pl+gw,h-8);
  if(data.length<2){g.textAlign='center';g.fillText(tr('Samlar data… en punkt var 10:e sekund','Collecting data… one point every 10 seconds'),pl+gw/2,pt+gh/2);return;}
  const X=i=>pl+gw*(1-(data.length-1-i)/(N-1)),Y=v=>pt+gh*(1-v/max);
  g.beginPath();g.moveTo(X(0),Y(data[0]));for(let i=1;i<data.length;i++)g.lineTo(X(i),Y(data[i]));
  g.strokeStyle='#9be36d';g.lineWidth=2;g.lineJoin='round';g.stroke();
  g.lineTo(X(data.length-1),pt+gh);g.lineTo(X(0),pt+gh);g.closePath();g.fillStyle='rgba(155,227,109,.13)';g.fill();
}
function linesRows(){return S.lines.map((l,i)=>`<tr class="${i===S.cur?'curl':''}"><td>${tr('Linje ','Line ')}${i+1}</td><td class="v" style="color:var(--ink)">${l.grid.size}</td><td class="v" style="color:var(--ink)">${starterCount(l)}/${maxStarters()}</td><td class="v ok">${cash(lineRate(l))}/s</td><td class="v">${l._wn?`<span class="warn">${l._wn} !</span>`:'–'}</td><td style="text-align:right"><button class="chip" data-goline="${i}">${tr('Visa','Show')}</button></td></tr>`).join('');}
function statsExtra(){
  const ch=(v,t)=>`<button class="chip${graphRange===v?' on':''}" data-grange="${v}">${t}</button>`;
  return `<h3>${tr('Inkomst över tid','Income over time')}</h3><div class="row" style="margin-bottom:6px">${ch('m10','10 min')}${ch('h1',tr('1 timme','1 hour'))}${ch('d1',tr('24 timmar','24 hours'))}</div><div class="graphwrap"><canvas id="st-graph" height="150"></canvas></div>`+
    `<h3>${tr('Linjer','Lines')}</h3><div class="tablewrap"><table><thead><tr><th>${tr('Linje','Line')}</th><th style="text-align:right">${tr('Maskiner','Machines')}</th><th style="text-align:right">${tr('Startare','Starters')}</th><th style="text-align:right">${tr('Inkomst','Income')}</th><th style="text-align:right">${tr('Fastnat','Stuck')}</th><th></th></tr></thead><tbody id="st-lines">${linesRows()}</tbody></table></div>`;
}

}

for(const el of [modal,linesEl,ordEl])el.addEventListener('click',()=>{moneyBefore=S.money;},true);

/* ============ LOOP ============ */
let lastT=performance.now(),uiAcc=0,saveAcc=0;
function frame(now){
  const dt=Math.min(.1,(now-lastT)/1000);lastT=now;
  if(!paused){time+=dt;update(dt);}
  const pan=650*dt/cam.z;
  if(keys.has('w')||keys.has('arrowup'))cam.y-=pan;if(keys.has('s')||keys.has('arrowdown'))cam.y+=pan;
  if(keys.has('a')||keys.has('arrowleft'))cam.x-=pan;if(keys.has('d')||keys.has('arrowright'))cam.x+=pan;clampCam();
  render();
  {const zl=$('zlv'),zt=Math.round(cam.z*100)+'%';if(zl.textContent!==zt)zl.textContent=zt;$('zin').disabled=cam.z>=3-1e-6;$('zout').disabled=cam.z<=.35+1e-6;}
  uiAcc+=dt;if(uiAcc>.2){uiAcc=0;$('money').textContent=cash(S.money);$('rate').textContent=fmt(currentRate())+RATE;
    {const r=currentRate();if(r>(S.stats.bestRate||0))S.stats.bestRate=r;}checkAch();updAchBtn();tutTick();ordRender(false);lineBadges();
    $('startc').textContent=starterCount()+'/'+maxStarters();refreshToolbar();updateLive();refreshPanel();
    for(const nb of linesEl.querySelectorAll('[data-cost]'))nb.disabled=S.money<+nb.dataset.cost;renderUndo();}
  saveAcc+=dt;if(saveAcc>5){saveAcc=0;save();}
  if(CG)CG.play(!paused&&modal.hidden);
  requestAnimationFrame(frame);
}
function start(data){
  buildSprites();resize();buildToolbar();setTool('select');
  let d=data&&data.save;
  let restored=false;if(!d){try{const pb=STORE.getItem(PRACT_KEY);if(pb){d=JSON.parse(pb);STORE.removeItem(PRACT_KEY);STORE.setItem(SAVE_KEY,pb);restored=true;}}catch(e){}}
  if(!d){try{const raw=STORE.getItem(SAVE_KEY);if(raw)d=JSON.parse(raw);}catch(e){}}
  if(d&&d.lines){loadData(d);centerCam();if(!(data&&data.save))applyOffline((Date.now()-(d.t||Date.now()))/1000,d.rate||0);}
  else{newGame(false);openPanel('start');}
  if(restored)setTimeout(()=>toast(tr('Övningen avbröts. Din riktiga fabrik är tillbaka.','Practice cancelled. Your real factory is back.'),true),800);
  window.addEventListener('resize',resize);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{});
  requestAnimationFrame(frame);
}
try{window.claude?.hot?.snapshot?.(()=>({save:serialize()}));}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
});

      window.__afStore=d;
    }catch(e){}
